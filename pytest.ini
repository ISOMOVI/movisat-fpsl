; ============================================================================
; FPSL WESO — a configuracao de pytest que nunca existiu
; ============================================================================
; 🚨 MEDIDO EM 18/11: 81 arquivos chamados `teste_*.py`, e NENHUMA configuracao
; de pytest. O efeito era que "a suite do FPSL" nao existia como coisa
; executavel: `pytest tests/` morria na COLETA, porque 64 desses 81 arquivos
; sao SCRIPTS -- nenhuma funcao de teste, tudo no topo do modulo -- e o pytest
; os importa para procurar testes, o que EXECUTA o script.
;
;   ERROR tests/teste_roteadores_painel.py - sqlite3.OperationalError: no such table
;   !!!!! Interrupted: 1 error during collection !!!!!
;
; Nao era teste reprovando: era script rodando por engano contra um banco que
; nao estava ali, e derrubando a coleta de todos os outros.
;
; ⚠️ E o que isso fazia comigo era pior que o erro: eu rodava 4 arquivos
; DIGITADOS A MAO, 133 dos 172 testes de verdade, e chamava aquilo de "a suite
; esta verde". Ficavam de fora 4 arquivos que rodariam bem, e um deles era da
; propria ponte (`teste_criar_os_ponte.py`, 22 testes). Teste novo em arquivo
; fora da minha lista nao rodava e ninguem notava -- a diferenca entre placar e
; verdade (`M5`).
;
; 🚨 NENHUM ARQUIVO FOI RENOMEADO NEM APAGADO. Os 64 scripts continuam
; servindo para rodar a mao, que e o que eles sao. Quem os deixa de fora e o
; `conftest.py`, por AST: arquivo sem funcao de teste nao e coletado. Lista
; fixa de 64 nomes envelheceria no primeiro script novo.

[pytest]
testpaths = tests
python_files = teste_*.py
python_classes = Test*
python_functions = test*

; 🔵 "liga o async" -- decisao dele, 18/11. Sao 55 testes `async def` em 9
; arquivos que NUNCA rodaram: o venv tem `anyio` como biblioteca e o plugin de
; pytest dele esta ativo, mas sem marcador nenhum o pytest 9 recusa com
; *"async def functions are not natively supported"* -- coletava e reprovava
; sem sequer tentar. Quem poe o marcador em todos e o `conftest.py`, para nao
; ter de tocar nos 9 arquivos.
;
; ⚠️ E o que esses 9 guardam e o fluxo de Operacoes: operacoes_f4 (15), f5 (8),
; f5b (6), aviso_previo (5), taxa_migracao (6), central_nas_duas (8),
; aquisicao_retirada (4), retirada_sem_comodato (2), tipo_veiculo (1).
markers =
    anyio: roda a funcao async no backend do anyio (posto pelo conftest)

; Sem `-q` e sem `--tb` apertado: quando quebra, o que ajuda e o rastro inteiro.
addopts = -ra
