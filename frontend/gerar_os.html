<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerar OS — FPSL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/painel/static/barra_status.css">
<style>
  :root {
    --yellow: #D97706; --yellow-dim: #FFFBEB;
    --green: #16a34a; --green-dim: #F0FDF4;
    --blue: #2563EB; --blue-dim: #EFF6FF; --blue-mid: #BFDBFE;
    --red: #DC2626; --red-dim: #FEF2F2;
    --bg: #F8FAFC; --bg2: #F1F5F9; --bg3: #E2E8F0; --text: #0F172A; --text2: #64748B;
    --border: #E2E8F0; --card: #FFFFFF; --radius: 8px;
    --sidebar-bg: #0F172A; --sidebar-tx: #94A3B8; --sidebar-w: 230px; --header-h: 56px;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { background:var(--bg2); font-family:'Inter',system-ui,sans-serif; color:var(--text); }
  .layout { display:flex; min-height:100vh; }
  .sidebar { width:var(--sidebar-w); background:var(--sidebar-bg); flex-shrink:0; display:flex; flex-direction:column;
             padding:20px 0; position:sticky; top:0; height:100vh; }
  .sidebar-logo { padding:0 20px 20px; font-weight:800; color:#fff; font-size:1rem; }
  .sidebar-nav { display:flex; flex-direction:column; gap:2px; padding:0 12px; flex:1; }
  .sidebar-nav a { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:7px;
                   color:var(--sidebar-tx); text-decoration:none; font-size:.86rem; font-weight:500; }
  .sidebar-nav a:hover { background:rgba(255,255,255,.06); color:#fff; }
  .sidebar-nav a.active { background:var(--blue); color:#fff; }
  .sidebar-bottom { padding:12px; }
  .sidebar-bottom button { width:100%; padding:9px; border-radius:7px; border:1px solid rgba(255,255,255,.15);
                            background:transparent; color:var(--sidebar-tx); font-size:.82rem; font-family:inherit; cursor:pointer; }
  .sidebar-bottom button:hover { background:rgba(255,255,255,.06); color:#fff; }
  .main { flex:1; padding:32px; max-width:820px; }
  h1 { font-size:1.3rem; font-weight:700; margin-bottom:20px; }
  .steps { display:flex; align-items:center; gap:6px; margin-bottom:24px; }
  .step-dot { width:26px; height:26px; border-radius:50%; background:var(--card); color:var(--text2);
              font-size:.74rem; font-weight:700; display:flex; align-items:center; justify-content:center;
              border:1.5px solid var(--border); flex-shrink:0; }
  .step-dot.active { background:var(--blue); color:#fff; border-color:var(--blue); }
  .step-dot.done { background:var(--green-dim); color:var(--green); border-color:var(--green); }
  .step-line { flex:1; height:1.5px; background:var(--border); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
  .panel { display:none; flex-direction:column; gap:16px; }
  .panel.active { display:flex; }
  label { font-size:.78rem; font-weight:600; display:block; margin-bottom:6px; }
  select, input[type=text] { width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:6px;
          background:var(--bg); color:var(--text); font-size:.88rem; font-family:inherit; }
  select:focus, input:focus { outline:none; border-color:var(--blue); background:var(--card); }
  .campo-com-botao { display:flex; gap:8px; }
  .campo-com-botao input { flex:1; }
  .drop { border:2px dashed var(--border); border-radius:10px; padding:32px; text-align:center;
          color:var(--text2); font-size:.86rem; cursor:pointer; }
  .drop:hover { border-color:var(--blue-mid); background:var(--blue-dim); }
  .drop input { display:none; }
  .btn { font-family:inherit; font-size:.86rem; font-weight:600; padding:10px 18px; border-radius:7px;
         border:1.5px solid transparent; cursor:pointer; }
  .btn-primary { background:var(--blue); color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-ghost { background:var(--card); color:var(--text); border-color:var(--border); }
  .footer-nav { display:flex; justify-content:space-between; margin-top:20px; }
  table { width:100%; border-collapse:collapse; font-size:.84rem; }
  th { text-align:left; color:var(--text2); font-weight:600; font-size:.72rem; text-transform:uppercase;
       letter-spacing:.03em; padding:8px; border-bottom:1.5px solid var(--border); }
  td { padding:8px; border-bottom:1px solid var(--border); vertical-align:top; }
  .badge { font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:999px; }
  .badge-blue { background:var(--blue-dim); color:var(--blue); }
  .badge-green { background:var(--green-dim); color:var(--green); }
  .badge-red { background:var(--red-dim); color:var(--red); }
  .msg { font-size:.82rem; padding:8px 12px; border-radius:6px; }
  .msg-erro { background:var(--red-dim); color:var(--red); }
  .msg-ok { background:var(--green-dim); color:var(--green); }
  .aviso { font-size:.78rem; color:var(--yellow); background:var(--yellow-dim); padding:8px 12px; border-radius:6px; }
  /* Caixa neutra de informação/progresso -- não é alerta, então não usa o
     amarelo do .aviso, que treina a pessoa a ignorar o aviso de verdade. */
  .aviso-info { font-size:.78rem; color:var(--text2); background:var(--bg2);
                padding:8px 12px; border-radius:6px; margin-bottom:10px; }
  .spinner { display:inline-block; width:11px; height:11px; vertical-align:-1px;
             border:2px solid var(--border); border-top-color:var(--text2);
             border-radius:50%; animation:girar .7s linear infinite; }
  @keyframes girar { to { transform:rotate(360deg); } }

  /* modal */
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:100;
              align-items:center; justify-content:center; }
  .modal-bg.open { display:flex; }
  .modal { background:var(--card); border-radius:12px; padding:20px; width:100%; max-width:460px;
           max-height:80vh; display:flex; flex-direction:column; gap:12px; }
  .modal-header { display:flex; justify-content:space-between; align-items:center; }
  .modal-header h3 { font-size:1rem; font-weight:700; }
  .modal-header button { background:none; border:none; font-size:1.1rem; cursor:pointer; color:var(--text2); }
  .modal-lista { overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .modal-item { padding:10px 12px; border:1px solid var(--border); border-radius:8px; cursor:pointer;
                font-size:.86rem; display:flex; justify-content:space-between; }
  .modal-item:hover { background:var(--blue-dim); border-color:var(--blue-mid); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">FPSL</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-bottom">
      <button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </aside>

  <main class="main">
    <h1>Gerar OS por contrato</h1>
    <div class="steps">
      <div class="step-dot active" id="dot-1">1</div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot-2">2</div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot-3">3</div>
    </div>

    <div class="card">

      <!-- ETAPA 1 -->
      <div class="panel active" id="panel-1">
        <div>
          <label for="perfil">Tipo de operação</label>
          <select id="perfil"></select>
        </div>
        <!-- Some inteiro nos perfis sem termo (manutenção): não há documento
             para extrair, então oferecer o campo seria oferecer um caminho
             que não existe. -->
        <div id="anexoWrap">
          <label>Contrato (PDF)</label>
          <div class="drop" id="drop" onclick="document.getElementById('arquivo').click()">
            <div id="dropLabel">Clique ou arraste o PDF do contrato aqui</div>
            <input type="file" id="arquivo" accept="application/pdf">
          </div>
        </div>
        <div id="semTermoAviso" style="display:none" class="aviso-info">
          Manutenção não vem de contrato — não há documento para anexar.
          Você informa cliente, placa e serviço na próxima etapa.
        </div>
        <div id="extraidoMsg"></div>
        <div id="alertaTransferencia"></div>
        <div id="itensRevisao"></div>
        <div class="footer-nav">
          <span></span>
          <button class="btn btn-primary" id="btnExtrair" onclick="extrair()">Gerar OS →</button>
        </div>
      </div>

      <!-- ETAPA 2 -->
      <div class="panel" id="panel-2">
        <div>
          <label for="clienteCampo">Cliente</label>
          <div class="campo-com-botao">
            <input type="text" id="clienteCampo" placeholder="Nenhum cliente selecionado" readonly>
            <button class="btn btn-ghost" onclick="abrirModalCliente('origem')">Buscar</button>
          </div>
        </div>
        <div id="clienteDestinoWrap" style="display:none">
          <label for="clienteDestinoCampo">Cliente destino (recebe o veículo)</label>
          <div class="campo-com-botao">
            <input type="text" id="clienteDestinoCampo" placeholder="Nenhum cliente selecionado" readonly>
            <button class="btn btn-ghost" onclick="abrirModalCliente('destino')">Buscar</button>
          </div>
        </div>
        <!-- Manutenção não tem documento de onde tirar a placa: o operador
             digita. Uma placa por geração, por decisão do usuário. -->
        <div id="placaManualWrap" style="display:none">
          <label for="placaManual">Placa do veículo</label>
          <input type="text" id="placaManual" placeholder="ex.: GJN 8689" oninput="checarPodeAvancar()">
          <label for="veiculoManual" style="margin-top:10px;display:block">Veículo (descrição que vai na OS)</label>
          <input type="text" id="veiculoManual" placeholder="ex.: VW 24.280">
        </div>
        <!-- Só nos perfis sem termo: num contrato o problema é ditado pelo
             documento, e oferecer escolha ali só convidaria erro. -->
        <div id="problemaWrap" style="display:none">
          <label for="problemaCampo">Problema (o que motivou o chamado)</label>
          <select id="problemaCampo" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:.86rem"></select>
        </div>
        <div>
          <label for="servicoCampo">Serviço (produtoServicoId)</label>
          <div class="campo-com-botao">
            <input type="text" id="servicoCampo" placeholder="Nenhum serviço selecionado" readonly>
            <button class="btn btn-ghost" onclick="abrirModalServico()">Buscar</button>
          </div>
        </div>
        <div id="termoWrap">
          <label for="termo">Termo (nº do contrato)</label>
          <input type="text" id="termo">
        </div>
        <div>
          <label for="observacao">OBS (campo livre — vai para a OBS da OS, abaixo da linha de criação)</label>
          <input type="text" id="observacao" placeholder="ex.: cliente relatou equipamento sem comunicar desde 12/08">
        </div>
        <div>
          <label for="prioridadeCampo">Prioridade das OS operacionais (a financeira sai sempre Normal)</label>
          <select id="prioridadeCampo" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:.86rem"></select>
        </div>
        <div>
          <label for="solucaoTecnica">Contexto da extração (vai pro campo "solução técnica" da OS -- o técnico preenche o resultado do serviço abaixo do separador)</label>
          <textarea id="solucaoTecnica" rows="2" style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:.86rem;font-family:inherit"></textarea>
        </div>
        <div id="motivoWrap">
          <label for="motivoFinanceira">Motivo — financeira sem custo (só usado se a OS financeira sair saldo 0)</label>
          <input type="text" id="motivoFinanceira" placeholder="ex.: por conta do técnico / acordo interno / liberado pela gestão">
        </div>
        <div class="footer-nav">
          <button class="btn btn-ghost" onclick="irPara(1)">← Voltar</button>
          <button class="btn btn-primary" id="btnMontar" onclick="montarResumo()" disabled>Ver resumo →</button>
        </div>
      </div>

      <!-- ETAPA 3 -->
      <div class="panel" id="panel-3">
        <div id="resumoInfo"></div>
        <div id="resumoAvisos"></div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Cliente</th><th>Placa</th><th>Veículo</th><th>Tipo</th><th>Descrição</th><th>Materiais</th></tr></thead>
            <tbody id="resumoTbody"></tbody>
          </table>
        </div>
        <div id="resultadoFinal"></div>
        <div class="footer-nav">
          <button class="btn btn-ghost" onclick="irPara(2)">← Voltar</button>
          <button class="btn btn-primary" id="btnGerar" onclick="gerarOs()" disabled>Gerar OS</button>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Modal: buscar cliente -->
<div class="modal-bg" id="modalCliente" onclick="if(event.target===this)fecharModal('modalCliente')">
  <div class="modal">
    <div class="modal-header"><h3>Buscar cliente no Harmonit</h3><button onclick="fecharModal('modalCliente')">✕</button></div>
    <input type="text" id="buscaCliente" placeholder="Nome, CNPJ ou CPF (mín. 3 caracteres)">
    <div class="modal-lista" id="clientesResultado"></div>
  </div>
</div>

<!-- Modal: buscar serviço -->
<div class="modal-bg" id="modalServico" onclick="if(event.target===this)fecharModal('modalServico')">
  <div class="modal">
    <div class="modal-header"><h3>Buscar serviço no Harmonit</h3><button onclick="fecharModal('modalServico')">✕</button></div>
    <input type="text" id="buscaServico" placeholder="Nome do serviço">
    <div class="modal-lista" id="servicosResultado"></div>
  </div>
</div>

<script src="/painel/static/barra_status.js"></script>
<script src="/painel/static/sidebar.js"></script>
<script>
const token = localStorage.getItem('fpsl_painel_token');
if (!token) window.location.href = '/painel';
montarSidebar('gerar_os');
function auth() { return { 'Authorization': 'Bearer ' + token }; }

// 🚨 NEM TODA RESPOSTA É JSON. Quando o nginx corta por tempo (504) ou o
// serviço cai (502), o corpo é uma PÁGINA HTML. Chamar `res.json()` nela
// estoura "Unexpected token '<'" -- e foi isso que a Erika viu na tela: um
// "erro json" que não diz nada sobre o que aconteceu de verdade (a consulta
// à WESO passou do tempo).
async function lerResposta(res) {
  const bruto = await res.text();
  let corpo = null;
  try { corpo = JSON.parse(bruto); } catch (e) { corpo = null; }
  return { ok: res.ok, status: res.status, corpo, bruto };
}

// Mensagem que diz o que fazer, não o que o parser achou do byte.
function mensagemDeErro(r, oQue) {
  const d = r.corpo && r.corpo.detail;
  if (d && typeof d === 'object' && d.mensagem) return d.mensagem;
  if (typeof d === 'string' && d) return d;
  if (r.status === 504 || r.status === 502) {
    return `${oQue}: o servidor passou do tempo. A consulta à WESO às vezes `
         + `demora — espere alguns segundos e tente de novo. Nenhuma OS foi criada.`;
  }
  if (r.status === 401) return 'Sua sessão expirou. Entre de novo.';
  if (r.status === 403) return 'Seu usuário não tem permissão para esta aba.';
  return `${oQue}: erro ${r.status}.`;
}
function abrirModal(id) { document.getElementById(id).classList.add('open'); }
function fecharModal(id) { document.getElementById(id).classList.remove('open'); }

// Texto extraído do PDF (veículo, item, alerta) e resultado de busca no
// Harmonit vão pra innerHTML em vários lugares -- sem escape, um PDF
// malicioso com "<img onerror=...>" num campo de descrição executaria script
// na sessão autenticada do admin (que tem permissão de escrita no Harmonit).
// Achado na auditoria de 2026-07-15, aplicado em todo innerHTML com dado
// externo deste arquivo.
function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

let PERFIS = {};
let extraido = null;
let clienteSelecionado = null;
let clienteDestinoSelecionado = null;
let servicoSelecionado = null;
let placasEditaveis = [];
let modalClienteAlvo = 'origem';
let payloadResumo = null; // payload exato usado no dry-run -- reaproveitado em gerarOs() pra garantir que o preview bate com o que é enviado de verdade

async function init() {
  const res = await fetch('/painel/api/perfis', { headers: auth() });
  if (res.status === 401) { window.location.href = '/painel'; return; }
  PERFIS = await res.json();
  const sel = document.getElementById('perfil');
  Object.entries(PERFIS).forEach(([chave, p]) => {
    const o = document.createElement('option');
    o.value = chave;
    o.textContent = p.label + (p.agrupado ? ` (${p.os_por_placa} OS agrupadas)` : p.os_por_placa > 1 ? ` (${p.os_por_placa} OS por placa)` : '');
    sel.appendChild(o);
  });
  // Prioridades (Etapa 2) -- default Normal
  try {
    const pr = await fetch('/painel/api/prioridades', { headers: auth() });
    if (pr.ok) {
      const data = await pr.json();
      const psel = document.getElementById('prioridadeCampo');
      (data.prioridades || []).forEach((p) => {
        const o = document.createElement('option');
        o.value = p.id; o.textContent = p.descricao;
        if (p.id === data.default) o.selected = true;
        psel.appendChild(o);
      });
    }
  } catch (e) { /* mantém select vazio -> backend usa default Normal */ }
  sel.addEventListener('change', aplicarPerfil);
  aplicarPerfil();
}
init();

// Perfil escolhido na Etapa 1, com os flags que o backend expõe em /perfis.
function perfilAtual() {
  return PERFIS[document.getElementById('perfil').value] || {};
}

// Sem termo = sem documento: o campo de anexo some, e com ele o Termo e o
// motivo da financeira, que não existem nesse caminho. Esconder em vez de
// desabilitar é de propósito -- campo cinza ainda parece campo que falta.
function aplicarPerfil() {
  const p = perfilAtual();
  const semTermo = !!p.sem_termo;
  document.getElementById('anexoWrap').style.display = semTermo ? 'none' : '';
  document.getElementById('semTermoAviso').style.display = semTermo ? '' : 'none';
  const termoWrap = document.getElementById('termoWrap');
  if (termoWrap) termoWrap.style.display = semTermo ? 'none' : '';
  const motivoWrap = document.getElementById('motivoWrap');
  if (motivoWrap) motivoWrap.style.display = p.sem_financeira ? 'none' : '';
  const placaWrap = document.getElementById('placaManualWrap');
  if (placaWrap) placaWrap.style.display = semTermo ? '' : 'none';
  document.getElementById('problemaWrap').style.display = semTermo ? '' : 'none';
  if (semTermo) { carregarProblemas(p.problema_nome); preencherServicoPadrao(p.produto_servico_nome); }
}

// Lista de Problemas do Harmonit, com o padrão do perfil já selecionado.
// Carregada uma vez e reaproveitada -- é a mesma lista para os dois perfis.
let PROBLEMAS = null;
async function carregarProblemas(nomePadrao) {
  const sel = document.getElementById('problemaCampo');
  if (!PROBLEMAS) {
    try {
      const r = await fetch('/painel/api/problemas', { headers: auth() });
      if (!r.ok) throw new Error('lista indisponível');
      PROBLEMAS = (await r.json()).problemas || [];
    } catch (e) {
      // Sem a lista o backend ainda resolve pelo nome do perfil -- então isto
      // é degradação, não bloqueio.
      sel.innerHTML = '<option value="">(lista indisponível — vai o padrão do perfil)</option>';
      return;
    }
  }
  const alvo = (nomePadrao || '').trim().toUpperCase();
  sel.innerHTML = PROBLEMAS.map((p) =>
    `<option value="${p.id}"${(p.descricao || '').trim().toUpperCase() === alvo ? ' selected' : ''}>${escapeHtml(p.descricao)}</option>`
  ).join('');
}

// O serviço do perfil (MANUTENÇÃO) já vem preenchido -- o operador confirma em
// vez de procurar. Continua trocável pelo botão Buscar.
async function preencherServicoPadrao(nome) {
  if (!nome || servicoSelecionado) return;
  try {
    const r = await fetch(`/painel/api/servicos/buscar?q=${encodeURIComponent(nome)}`, { headers: auth() });
    if (!r.ok) return;
    const d = await r.json();
    const alvo = nome.trim().toUpperCase();
    const achado = (d.resultados || []).find((s) => (s.descricao || '').trim().toUpperCase() === alvo);
    if (achado) selecionarServico(achado);
  } catch (e) { /* fica vazio, o operador busca na mão */ }
}

// ── Caixa de progresso ──────────────────────────────────────────────────────
// A geração de manutenção vai à WESO ao vivo (~2,5s) e ao Harmonit para
// resolver Tipo e Problema. Sem retorno visual, o operador clica de novo.
// Mostra as etapas NOMEADAS, na ordem em que o backend as executa, com o
// spinner na etapa corrente. Não é barra de porcentagem: porcentagem sobre
// chamada de rede é chute, e chute que parece medida é pior que nada.
let _progressoTimer = null;
function progresso(etapas) {
  // 🚨 ACEITA TEXTO TAMBÉM, DE PROPÓSITO. Esta função passou a receber uma
  // LISTA de etapas em 14/08, e uma chamada antiga ficou passando string.
  // String tem `.length` (não caiu no early return) e NÃO tem `.map` — o
  // TypeError estourava antes do `fetch`, FORA do try, e a tela não fazia
  // nada: nem erro, nem mensagem, nem botão liberado. Foi assim que a
  // extração de termo parou de funcionar sem ninguém ver.
  if (typeof etapas === 'string') etapas = [etapas];
  let cx = document.getElementById('progressoCaixa');
  if (!etapas || !etapas.length) {
    if (_progressoTimer) { clearInterval(_progressoTimer); _progressoTimer = null; }
    if (cx) cx.remove();
    return;
  }
  if (!cx) {
    cx = document.createElement('div');
    cx.id = 'progressoCaixa';
    cx.className = 'aviso-info';
    document.querySelector('.panel.active').prepend(cx);
  }
  let atual = 0;
  const t0 = Date.now();
  const desenhar = () => {
    // 🚨 O RELÓGIO EXISTE PARA A ESPERA LONGA. A consulta à WESO oscila muito
    // (medido em 14/08: de 1s a 33s para a mesma coisa), e sem nada se mexendo
    // na tela quem está usando conclui que travou e clica de novo. Segundo que
    // anda é a diferença entre "está trabalhando" e "morreu".
    const seg = Math.floor((Date.now() - t0) / 1000);
    const relogio = seg >= 3
      ? `<div style="margin-top:6px;opacity:.7">${seg}s — a WESO às vezes demora; não feche nem clique de novo</div>`
      : '';
    cx.innerHTML = etapas.map((e, i) => {
      if (i < atual) return `<div>✓ ${escapeHtml(e)}</div>`;
      if (i === atual) return `<div><span class="spinner"></span> ${escapeHtml(e)}</div>`;
      return `<div style="opacity:.45">· ${escapeHtml(e)}</div>`;
    }).join('') + relogio;
  };
  desenhar();
  // Avança a marcação a cada 3s -- é o limiar que o usuário pediu para o
  // ícone de carregamento aparecer, e serve de régua honesta: se a etapa
  // durar menos, ninguém a vê; se travar, fica visível onde travou.
  // ⚠️ Redesenha a cada segundo (para o relógio andar) mas só AVANÇA a etapa a
  // cada 3s -- que é o limiar em que a espera passa a incomodar.
  if (_progressoTimer) clearInterval(_progressoTimer);
  let tique = 0;
  _progressoTimer = setInterval(() => {
    tique += 1;
    if (tique % 3 === 0 && atual < etapas.length - 1) atual += 1;
    desenhar();
  }, 1000);
}

document.getElementById('arquivo').addEventListener('change', (e) => {
  if (e.target.files[0]) document.getElementById('dropLabel').textContent = e.target.files[0].name;
});

function irPara(n) {
  [1, 2, 3].forEach((i) => {
    document.getElementById('panel-' + i).classList.toggle('active', i === n);
    const dot = document.getElementById('dot-' + i);
    dot.classList.toggle('active', i === n);
    dot.classList.toggle('done', i < n);
  });
}

async function extrair() {
  const perfil = document.getElementById('perfil').value;

  // 🚨 SEM TERMO NÃO HÁ O QUE EXTRAIR. Manutenção pula a extração inteira e
  // vai direto para a Etapa 2 com uma linha de placa em branco, para o
  // operador digitar. Uma placa por geração (regra do usuário, 14/08).
  if (perfilAtual().sem_termo) {
    extraido = { itens: [], placas: [] };
    placasEditaveis = [{ placa: '', veiculo: '', sem_bloqueio: false }];
    document.getElementById('extraidoMsg').innerHTML = '';
    document.getElementById('itensRevisao').innerHTML = '';
    document.getElementById('alertaTransferencia').innerHTML = '';
    document.getElementById('clienteDestinoWrap').style.display = 'none';
    document.getElementById('solucaoTecnica').value = '';
    // ⚠️ NÃO há o que renderizar aqui. A placa da manutenção é digitada na
    // Etapa 2 e lida direto dos campos em `_montarPayloadBase` -- a linha em
    // branco acima existe só para o payload não sair vazio se algo falhar
    // antes. Chamar um renderizador de placas aqui foi um ReferenceError que
    // travava o fluxo inteiro antes de trocar de etapa.
    irPara(2);
    checarPodeAvancar();
    return;
  }

  const arquivo = document.getElementById('arquivo').files[0];
  if (!arquivo) { alert('Escolha um PDF primeiro.'); return; }
  const btn = document.getElementById('btnExtrair');
  btn.disabled = true; btn.textContent = 'Extraindo...';
  const fd = new FormData();
  fd.append('arquivo', arquivo);
  try {
    // ⚠️ DENTRO do try. Fora dele, qualquer erro aqui some sem mensagem.
    progresso(['Lendo o documento', 'Extraindo placas e itens',
               'Conferindo os vínculos']);
    const res = await fetch(`/painel/api/extrair?perfil=${perfil}`, { method: 'POST', headers: auth(), body: fd });
    const r = await lerResposta(res);
    if (!r.ok || !r.corpo) throw new Error(mensagemDeErro(r, 'Falha na extração'));
    extraido = r.corpo;

    // Forma dos dados de veículo muda por perfil -- Substituição vem pareada
    // (pares[].placa_saida/placa_entrada), Rescisão/Transferência vem em
    // "veiculos" (com documento_referencia e possível sem_placa), os demais
    // em "placas" (coluna mesclada, com sem_bloqueio).
    if (perfil === 'substituicao') {
      placasEditaveis = (extraido.pares || []).map((par) => ({
        placa: par.placa_saida, veiculo: par.veiculo_saida,
        placa_entrada: par.placa_entrada, veiculo_entrada: par.veiculo_entrada,
        sem_bloqueio: false,
      }));
    } else {
      // Mantém tudo que tem algo na coluna PLACA, inclusive identificador
      // não-convencional (perfuratriz por nº de série, escavadeira por modelo).
      // Decisão do usuário 2026-07-29: "o que tiver no campo placa é a placa".
      // Antes filtrava por formato e as máquinas sumiam, gerando falsa
      // divergência contra a quantidade de rastreadores do contrato.
      placasEditaveis = (extraido.placas || extraido.veiculos || [])
        .filter((p) => p.placa)
        .map((p) => ({ ...p }));
    }

    document.getElementById('termo').value = extraido.termo || '';
    const nTotal = (extraido.pares || extraido.placas || extraido.veiculos || []).length;
    let msg = `<div class="msg msg-ok">Extraído: Termo ${escapeHtml(extraido.termo) || '—'}, ${placasEditaveis.length} de ${nTotal} veículo(s), ${(extraido.itens || []).length} item(ns)</div>`;
    if (!extraido.cnpj) msg += '<div class="aviso" style="margin-top:8px">CNPJ não encontrado — confirme o cliente manualmente na próxima etapa.</div>';
    // Placa fora do padrão convencional ENTRA na geração; o aviso é só para
    // conferência visual, porque errar a leitura de um nº de série é mais
    // fácil que errar uma placa Mercosul.
    const naoConvencionais = placasEditaveis.filter((p) => p.placa_convencional === false);
    if (naoConvencionais.length) {
      const lista = naoConvencionais.map((p) => escapeHtml(p.placa)).join(', ');
      msg += `<div class="aviso" style="margin-top:8px">${naoConvencionais.length} placa(s) fora do padrão convencional (máquina identificada por nº de série ou modelo): ${lista} — entram normalmente na geração, confira a grafia.</div>`;
    }
    const semNadaCount = nTotal - placasEditaveis.length;
    if (semNadaCount > 0) msg += `<div class="aviso" style="margin-top:8px">${semNadaCount} linha(s) sem nada na coluna PLACA — verifique o documento.</div>`;

    // 🚨 LINHA DA COLUNA DE VEÍCULO QUE NÃO VIROU NENHUMA PLACA.
    //
    // NÃO é o caso de máquina com série/chassi: essas entram normalmente, como
    // placa não convencional, e aparecem no aviso acima. Aqui fica só o que o
    // extrator não soube ler — e que por isso ficaria de fora do termo sem
    // ninguém perceber.
    //
    // O contador `semNadaCount` também não pega estas: ele mede linha VAZIA, e
    // estas têm conteúdo. São coisas diferentes e precisam de avisos diferentes.
    const naoLidas = extraido.veiculos_sem_placa || [];
    if (naoLidas.length) {
      const itens = naoLidas.map((v) => `<li>${escapeHtml(v.texto)}</li>`).join('');
      msg += `<div class="aviso" style="margin-top:8px">`
           + `<strong>${naoLidas.length} linha(s) da coluna de veículos sem placa reconhecida</strong> — `
           + `não entram na geração. Confira no termo se são veículos de verdade:`
           + `<ul style="margin:6px 0 0 18px">${itens}</ul></div>`;
    }
    document.getElementById('extraidoMsg').innerHTML = msg;

    // Alerta de transferência disfarçada -- achado 2026-07-15 ("termo
    // errado.pdf"): Rescisão cujo conteúdo é na verdade transferência de
    // titularidade pra outro cliente. Não bloqueia, só avisa.
    const alertaDiv = document.getElementById('alertaTransferencia');
    if (extraido.alerta_transferencia) {
      alertaDiv.innerHTML = `<div class="aviso">⚠ Este termo menciona transferência de titularidade: "...${escapeHtml(extraido.alerta_transferencia)}..." — confirme se o lado correspondente (origem ou destino) já foi ou será processado separadamente.</div>`;
      document.getElementById('solucaoTecnica').value = `Termo menciona transferência de titularidade: "${extraido.alerta_transferencia}". Confirmar lado correspondente.`;
    } else {
      alertaDiv.innerHTML = '';
      document.getElementById('solucaoTecnica').value = '';
    }

    // Revisão de itens x vínculo -- mostra já na Etapa 1 pra não surpreender
    // só no final (geração bloqueia com 409 se algum item não tiver vínculo).
    const itensDiv = document.getElementById('itensRevisao');
    if ((extraido.itens || []).length) {
      const linhas = extraido.itens.map((it) => {
        const v = it.vinculo;
        const badge = !v ? '<span class="badge badge-red">sem vínculo</span>'
          : v.oculto ? '<span class="badge badge-blue">oculto (não vira material)</span>'
          : '<span class="badge badge-green">vinculado</span>';
        return `<tr><td>${escapeHtml(it.descricao)}</td><td>${escapeHtml(it.quantidade) || '—'}</td><td>${escapeHtml(it.comodato_ou_aquisicao) || '—'}</td><td>${badge}</td></tr>`;
      }).join('');
      itensDiv.innerHTML = `<div style="overflow-x:auto"><table><thead><tr><th>Item do contrato</th><th>Qtd</th><th>Tipo</th><th>Vínculo Harmonit</th></tr></thead><tbody>${linhas}</tbody></table></div>`;
    } else {
      itensDiv.innerHTML = '';
    }

    // Mostra/esconde campo de cliente destino conforme o perfil
    document.getElementById('clienteDestinoWrap').style.display = perfil === 'transferencia' ? '' : 'none';
    clienteDestinoSelecionado = null;
    document.getElementById('clienteDestinoCampo').value = '';

    // pré-seleciona cliente pelo CNPJ, se achou
    if (extraido.cnpj) {
      const r = await fetch(`/painel/api/clientes/buscar?q=${extraido.cnpj}`, { headers: auth() });
      const d = await r.json();
      if (d.resultados.length) selecionarCliente(d.resultados[0], 'origem');
    }
    // deixa o nome sugerido pronto pra busca manual, mesmo sem CNPJ
    if (!clienteSelecionado && extraido.cliente_nome_sugerido) {
      document.getElementById('buscaCliente').value = extraido.cliente_nome_sugerido;
    }
    checarPodeAvancar();
    irPara(2);
  } catch (err) {
    document.getElementById('extraidoMsg').innerHTML = `<div class="msg msg-erro">${escapeHtml(err.message)}</div>`;
  } finally {
    progresso(null);
    btn.disabled = false; btn.textContent = 'Gerar OS →';
  }
}

function abrirModalCliente(alvo) {
  modalClienteAlvo = alvo || 'origem';
  abrirModal('modalCliente');
  if (modalClienteAlvo === 'origem' && extraido && extraido.cliente_nome_sugerido && !document.getElementById('buscaCliente').value) {
    document.getElementById('buscaCliente').value = extraido.cliente_nome_sugerido;
  }
  if (document.getElementById('buscaCliente').value.length >= 3) buscarCliente(document.getElementById('buscaCliente').value);
}

let buscaClienteTimeout;
document.getElementById('buscaCliente').addEventListener('input', (e) => {
  clearTimeout(buscaClienteTimeout);
  buscaClienteTimeout = setTimeout(() => buscarCliente(e.target.value), 400);
});

async function buscarCliente(q) {
  if (!q || q.length < 3) return;
  const res = await fetch(`/painel/api/clientes/buscar?q=${encodeURIComponent(q)}`, { headers: auth() });
  const data = await res.json();
  const div = document.getElementById('clientesResultado');
  if (!data.resultados.length) { div.innerHTML = '<div class="aviso">Nenhum cliente encontrado.</div>'; return; }
  div.innerHTML = '';
  data.resultados.forEach((c) => {
    const el = document.createElement('div');
    el.className = 'modal-item';
    el.innerHTML = `<span>${escapeHtml(c.nome)}</span><span style="color:var(--text2)">${escapeHtml(c.cnpjCpf) || ''}</span>`;
    el.onclick = () => { selecionarCliente(c, modalClienteAlvo); fecharModal('modalCliente'); };
    div.appendChild(el);
  });
}

function selecionarCliente(c, alvo) {
  if (alvo === 'destino') {
    clienteDestinoSelecionado = c;
    document.getElementById('clienteDestinoCampo').value = c.nome;
  } else {
    clienteSelecionado = c;
    document.getElementById('clienteCampo').value = c.nome;
  }
  checarPodeAvancar();
}

function abrirModalServico() {
  abrirModal('modalServico');
  buscarServico(document.getElementById('buscaServico').value || '');
}

let buscaServicoTimeout;
document.getElementById('buscaServico').addEventListener('input', (e) => {
  clearTimeout(buscaServicoTimeout);
  buscaServicoTimeout = setTimeout(() => buscarServico(e.target.value), 400);
});

async function buscarServico(q) {
  const res = await fetch(`/painel/api/servicos/buscar?q=${encodeURIComponent(q || '')}`, { headers: auth() });
  const data = await res.json();
  const div = document.getElementById('servicosResultado');
  if (!data.resultados.length) { div.innerHTML = '<div class="aviso">Nenhum serviço encontrado.</div>'; return; }
  div.innerHTML = '';
  data.resultados.forEach((s) => {
    const el = document.createElement('div');
    el.className = 'modal-item';
    el.innerHTML = `<span>${escapeHtml(s.descricao)}</span><span style="color:var(--text2)">#${escapeHtml(s.id)}</span>`;
    el.onclick = () => { selecionarServico(s); fecharModal('modalServico'); };
    div.appendChild(el);
  });
}

function selecionarServico(s) {
  servicoSelecionado = s;
  document.getElementById('servicoCampo').value = `${s.descricao} (#${s.id})`;
  checarPodeAvancar();
}

function checarPodeAvancar() {
  const perfil = document.getElementById('perfil').value;
  const precisaDestino = perfil === 'transferencia';
  // Sem termo a placa é digitada, e sem ela não há OS possível.
  const placaOk = !perfilAtual().sem_termo
    || !!(document.getElementById('placaManual') || {}).value?.trim();
  document.getElementById('btnMontar').disabled = !(
    clienteSelecionado && servicoSelecionado && placaOk
    && (!precisaDestino || clienteDestinoSelecionado)
  );
}

function _montarPayloadBase(confirmar) {
  const perfilChave = document.getElementById('perfil').value;
  if (perfilAtual().sem_termo) {
    placasEditaveis = [{
      placa: document.getElementById('placaManual').value.trim(),
      veiculo: document.getElementById('veiculoManual').value.trim(),
      sem_bloqueio: false,
    }];
  }
  const placas = placasEditaveis.map((p) => {
    const base = { placa: p.placa, veiculo: p.veiculo || '', sem_bloqueio: !!p.sem_bloqueio };
    if (perfilChave === 'substituicao') {
      base.placa_entrada = p.placa_entrada;
      base.veiculo_entrada = p.veiculo_entrada || '';
    }
    if (perfilChave === 'transferencia' && clienteDestinoSelecionado) {
      base.cliente_id_destino = clienteDestinoSelecionado.id;
    }
    return base;
  });
  return {
    perfil: perfilChave,
    cliente_id: clienteSelecionado.id,
    termo: document.getElementById('termo').value,
    termo_relacionado: (extraido && extraido.termo_relacionado) || '',
    produto_servico_id: servicoSelecionado.id,
    placas,
    itens: (extraido.itens || []).map((it) => ({
      descricao: it.descricao, quantidade: it.quantidade,
      valor_unitario: it.valor_unitario, comodato_ou_aquisicao: it.comodato_ou_aquisicao,
    })),
    solucao_tecnica: document.getElementById('solucaoTecnica').value,
    observacao: document.getElementById('observacao').value,
    problema_id: parseInt(document.getElementById('problemaCampo').value, 10) || null,
    prioridade_id: parseInt(document.getElementById('prioridadeCampo').value, 10) || 382,
    motivo_financeira_zero: document.getElementById('motivoFinanceira').value,
    confirmar,
  };
}

// Etapa 3 chama o próprio /gerar-os em modo simulação (confirmar:false) --
// o resumo mostrado é o resultado REAL do backend (alocação de materiais
// respeitando sem_bloqueio, avisos de quantidade, vínculo resolvido), não um
// preview client-side desconectado do que vai ser enviado de verdade
// (achado 2026-07-15: a versão anterior nem mandava "itens" no payload real,
// só no preview visual -- materiais nunca eram anexados na prática).
async function montarResumo() {
  const btn = document.getElementById('btnMontar');
  btn.disabled = true; btn.textContent = 'Calculando...';
  progresso(perfilAtual().sem_termo
    ? ['Consultando a placa na WESO', 'Lendo o equipamento vinculado',
       'Montando a descrição e os itens']
    : ['Resolvendo os vínculos dos itens', 'Alocando materiais por placa',
       'Montando a descrição e os itens']);
  try {
    const payload = _montarPayloadBase(false);
    const res = await fetch('/painel/api/gerar-os', {
      method: 'POST',
      headers: { ...auth(), 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const r = await lerResposta(res);
    if (!r.ok) {
      const detalhe = r.corpo && r.corpo.detail;
      if (detalhe && detalhe.tipo === 'vinculos_pendentes') {
        throw new Error(`Itens sem vínculo Harmonit: ${detalhe.itens.join(', ')}. Cadastre o vínculo antes de gerar.`);
      }
      throw new Error(mensagemDeErro(r, 'Falha ao montar resumo'));
    }
    if (!r.corpo) throw new Error(mensagemDeErro(r, 'Falha ao montar resumo'));
    const data = r.corpo;
    payloadResumo = payload; // reaproveitado em gerarOs(), com confirmar:true

    const tbody = document.getElementById('resumoTbody');
    tbody.innerHTML = data.operacoes.map((op) => {
      const tipoLabel = op.rotulo || (PERFIS[payload.perfil] && PERFIS[payload.perfil].label) || payload.perfil;
      return `<tr><td>${escapeHtml(op.cliente_id)}</td><td><strong>${escapeHtml(op.placa)}</strong></td><td>${escapeHtml(op.veiculo) || '—'}</td>` +
        `<td><span class="badge badge-blue">${tipoLabel}</span></td>` +
        `<td style="font-size:.78rem;color:var(--text2)">${escapeHtml(op.descricao)}</td>` +
        `<td style="font-size:.78rem">${op.materiais.length} item(ns)</td></tr>`;
    }).join('');

    const fmtMoeda = (v) => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('resumoInfo').innerHTML =
      `<div class="msg msg-ok">Cliente: <strong>${escapeHtml(clienteSelecionado.nome)}</strong>${clienteDestinoSelecionado ? ' → <strong>' + escapeHtml(clienteDestinoSelecionado.nome) + '</strong>' : ''} · Serviço: <strong>${escapeHtml(servicoSelecionado.descricao)}</strong> · Total: <strong>${data.total_os} OS</strong> a gerar</div>` +
      `<div class="msg" style="background:var(--bg2);margin-top:8px;font-size:.78rem">Valor total do contrato: <strong>${fmtMoeda(data.valor_total_contrato)}</strong> · Valor total anexado como material: <strong>${fmtMoeda(data.valor_total_anexado)}</strong></div>` +
      (data.solucao_tecnica_preview ? `<div class="msg" style="background:var(--bg2);margin-top:8px;white-space:pre-wrap;font-size:.78rem">${escapeHtml(data.solucao_tecnica_preview)}</div>` : '');
    document.getElementById('resumoAvisos').innerHTML = (data.avisos || [])
      .map((a) => `<div class="aviso" style="margin-bottom:6px">⚠ ${escapeHtml(a)}</div>`).join('');
    document.getElementById('resultadoFinal').innerHTML = '';
    document.getElementById('btnGerar').disabled = false;
    irPara(3);
  } catch (err) {
    alert(err.message);
  } finally {
    progresso(null);
    btn.disabled = false; btn.textContent = 'Ver resumo →';
  }
}

async function gerarOs() {
  const btn = document.getElementById('btnGerar');
  if (!payloadResumo) { alert('Monte o resumo primeiro.'); return; }
  const total = document.querySelectorAll('#resumoTbody tr').length;
  if (!confirm(`Confirma a geração de ${total} OS no Harmonit? Essa ação é real, não tem como desfazer em lote.`)) return;
  btn.disabled = true; btn.textContent = 'Gerando...';
  {
    const p = perfilAtual();
    const etapas = ['Criando a OS no Harmonit'];
    if (p.numero_na_descricao) {
      etapas.push('Coletando a numeração da OS', 'Gravando o número na descrição');
    }
    etapas.push('Auditando o que foi anexado');
    if (p.liberar_serie) etapas.push('Liberando a placa de manutenção');
    progresso(etapas);
  }
  try {
    const res = await fetch('/painel/api/gerar-os', {
      method: 'POST',
      headers: { ...auth(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payloadResumo, confirmar: true }),
    });
    // ⚠️ ESTA ROTA NÃO CONFERIA `res.ok`. Numa resposta de erro o `res.json()`
    // estourava e o operador ficava sem saber SE alguma OS foi criada -- que é
    // a pergunta mais cara desta tela.
    const r = await lerResposta(res);
    if (!r.ok || !r.corpo) throw new Error(mensagemDeErro(r, 'Falha ao gerar'));
    const data = r.corpo;
    const div = document.getElementById('resultadoFinal');
    let html = data.resultados.map((r) =>
      r.ok
        ? `<div class="msg msg-ok">✓ ${escapeHtml(r.placa)} (cliente ${escapeHtml(r.cliente_id)}) → OS nº ${escapeHtml(r.numero_ordem)} (id ${escapeHtml(r.os_id)})</div>`
        : `<div class="msg msg-erro">✗ ${escapeHtml(r.placa)} → ${escapeHtml(r.erro)}</div>`
    ).join('');

    // 🚨 O RESULTADO DA LIBERAÇÃO FICA NA TELA, NÃO EM CAIXA QUE SOME
    // (pedido do usuário, 14/08). Quando dá errado, os números `veiculo_id` e
    // `rastreador_id` são exatamente o que uma pessoa precisa para resolver na
    // mão na WESO -- se somem da tela, some a informação junto.
    html += (data.liberacoes || []).map((l) => {
      if (l.ok) {
        return `<div class="msg msg-ok">✓ ${escapeHtml(l.placa)} — equipamento liberado: `
             + `${(l.passos || []).map(escapeHtml).join('; ')}</div>`;
      }
      const d = l.dados_para_correcao || {};
      const numeros = Object.entries(d)
        .filter(([, v]) => v !== null && v !== undefined && v !== '')
        .map(([k, v]) => `${escapeHtml(k)}: <code>${escapeHtml(v)}</code>`)
        .join(' · ');
      return `<div class="msg msg-erro"><strong>✗ ${escapeHtml(l.placa)} — ${escapeHtml(l.erro)}</strong>`
           + ((l.passos || []).length ? `<div style="margin-top:6px;font-size:.78rem">O que chegou a acontecer: ${(l.passos || []).map(escapeHtml).join('; ')}</div>` : '')
           + (numeros ? `<div style="margin-top:6px;font-size:.78rem">Para corrigir na WESO — ${numeros}</div>` : '')
           + `</div>`;
    }).join('');

    div.innerHTML = html;
    btn.style.display = 'none';
  } catch (err) {
    document.getElementById('resultadoFinal').innerHTML = `<div class="msg msg-erro">${escapeHtml(err.message)}</div>`;
  } finally {
    progresso(null);
    btn.disabled = false; btn.textContent = 'Gerar OS';
  }
}
</script>
</body>
</html>
