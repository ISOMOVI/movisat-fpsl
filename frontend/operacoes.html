<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operações — FPSL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/painel/static/barra_status.css">
<!-- 🚨 CSS PRÓPRIO, clonado do gerar_os.html. As duas telas velhas vão ser
     apagadas; estilo compartilhado com elas sumiria junto. -->
<link rel="stylesheet" href="/painel/static/operacoes.css">
<style>
  /* Só o que é desta tela e não existe nas outras. */
  .etapa-titulo { font-size:.95rem; font-weight:700; margin-bottom:2px; }
  .etapa-sub { font-size:.8rem; color:var(--text2); margin-bottom:16px; }
  .em-construcao { border:1.5px dashed var(--border); border-radius:10px; padding:28px;
                   text-align:center; color:var(--text2); font-size:.86rem; }
  .em-construcao code { background:var(--bg2); padding:1px 6px; border-radius:4px; }
  .step-dot.locked { opacity:.45; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">FPSL</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-bottom">
      <button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
    </div>
  </aside>

  <main class="main">
    <h1>Operações</h1>

    <div class="steps">
      <div class="step-dot active" id="dot-1">1</div>
      <div class="step-line"></div>
      <div class="step-dot locked" id="dot-2">2</div>
      <div class="step-line"></div>
      <div class="step-dot locked" id="dot-3">3</div>
      <div class="step-line"></div>
      <div class="step-dot locked" id="dot-4">4</div>
    </div>

    <div class="card">
      <!-- Retomada: so aparece quando ha lote pendente no navegador. -->
      <div id="barraRetomar" class="retomar" style="display:none">
        <div id="retomarTexto"></div>
        <div class="retomar-acoes">
          <button class="btn btn-primary" onclick="retomarLote()">Continuar</button>
          <button class="btn btn-ghost" onclick="descartarLote()">Descartar</button>
        </div>
      </div>

      <!-- ETAPA 1 — documento -->
      <div class="panel active" id="panel-1">
        <div class="etapa-titulo">1 · Documento</div>
        <div>
          <label for="perfil">Tipo de operação</label>
          <select id="perfil"></select>
        </div>

        <!-- Some inteiro nos perfis sem termo: oferecer o campo seria oferecer
             um caminho que não existe. -->
        <div id="anexoWrap">
          <label>Termo (PDF)</label>
          <div class="drop" id="drop" onclick="document.getElementById('arquivo').click()">
            <div id="dropLabel">Clique ou arraste o PDF do termo aqui</div>
            <input type="file" id="arquivo" accept="application/pdf" onchange="aoEscolher()">
          </div>
        </div>

        <div class="msg" id="msgEtapa1" style="display:none"></div>
        <div id="leitura" style="display:none">
          <div class="aviso-info" id="leituraResumo"></div>
          <div id="leituraNaoLidos"></div>
        </div>
      </div>

      <!-- ETAPA 2 — cliente -->
      <div class="panel" id="panel-2">
        <div class="etapa-titulo">2 · Cliente</div>
        <!-- 🚨 SÓ APARECE QUANDO O TERMO NÃO TRAZ O DOCUMENTO. Medido em
             19/08: a rescisão vem sem `cnpj` e sem `cpf`, só com o nome. E
             cruzar por nome é proibido -- o mesmo CNPJ tem razão social
             diferente nos dois sistemas. Então quem informa é gente, com o
             nome do termo à vista para conferir. -->
        <div id="docWrap" style="display:none">
          <div class="aviso bloco">
            <strong>Este termo não traz o CNPJ/CPF.</strong>
            No termo: <strong id="nomeNoTermo"></strong>
          </div>
          <div class="campo-com-botao">
            <input type="text" id="docDigitado" placeholder="CNPJ ou CPF do cliente do termo">
            <button class="btn btn-primary" onclick="usarDocDigitado()">Usar este documento</button>
          </div>
        </div>
        <div class="msg" id="msgEtapa2" style="display:none"></div>
        <!-- 🚨 O CAMPO CLONADO DO GERAR OS, e FORA do bloco escondido. Até
             21/08 a etapa 2 era só a tabela de conferência, que só aparece
             depois de o cruzamento voltar -- então nos perfis SEM TERMO, que
             não têm documento para cruzar, a etapa inteira ficava em branco.
             O campo é a âncora do passo: existe antes de haver resposta. -->
        <div class="campo-cliente">
          <label for="clienteCampo">Cliente da operação</label>
          <div class="campo-com-botao">
            <input type="text" id="clienteCampo" readonly
                   placeholder="Nenhum cliente confirmado">
            <button class="btn btn-ghost" id="btnBuscarCliente"
                    onclick="abrirModalCliente()">Buscar</button>
          </div>
        </div>
        <div id="cliente" style="display:none">
          <table><thead><tr>
            <th class="col-sistema">Sistema</th><th>Nome</th><th class="col-id">Id</th>
          </tr></thead><tbody id="clienteCorpo"></tbody></table>
          <div id="clienteRecado" class="bloco-acima"></div>
          <div id="clienteAcao" class="bloco-acima"></div>
        </div>
      </div>

      <!-- ETAPA 3 — placas -->
      <div class="panel" id="panel-3">
        <div class="etapa-titulo">3 · Placas</div>
        <div class="msg" id="msgEtapa3" style="display:none"></div>

        <!-- 🚨 SÓ NOS PERFIS SEM TERMO (decisão do usuário, 21/08). Nos outros
             a placa vem do documento, e oferecer uma lista ao lado convidaria a
             operar em placa que o termo não menciona. -->
        <div id="addPlacaWrap" class="bloco" style="display:none">
          <div class="campo-com-botao">
            <select id="placaDoCliente"></select>
            <button class="btn btn-ghost" onclick="adicionarPlaca()">Adicionar</button>
          </div>
        </div>

        <table id="tabelaPlacas"><thead id="cabPlacas"></thead><tbody></tbody></table>
        <div class="acoes">
          <button class="btn btn-primary" id="btnPlacas" onclick="processarPlacas()"></button>
          <span id="progressoPlacas" class="dim-pequeno"></span>
        </div>
      </div>

      <!-- ETAPA 4 — OS -->
      <div class="panel" id="panel-4">
        <div class="etapa-titulo">4 · Ordens de serviço</div>
        <div class="aviso-info" id="osInfo"></div>
        <div class="msg" id="msgEtapa4" style="display:none"></div>

        <div class="linha-campos">
          <div class="campo campo-largo">
            <label for="servicoCampo">Produto/Serviço do cabeçalho</label>
            <div class="campo-com-botao">
              <input type="text" id="servicoCampo" readonly
                     placeholder="Nenhum serviço selecionado">
              <button class="btn btn-ghost" onclick="abrirModalServico()">Buscar</button>
            </div>
          </div>
          <div class="campo">
            <label for="prioridadeId">Prioridade</label>
            <select id="prioridadeId"></select>
          </div>
          <div class="campo" id="campoProblema" hidden>
            <label for="problemaId">Problema</label>
            <select id="problemaId"></select>
          </div>
        </div>

        <!-- Só no ressarcimento: o valor e, quando ele é zero, o motivo.
             Os dois já eram esperados pelo servidor e a tela não os tinha. -->
        <div class="linha-campos" id="blocoRessarcimento" hidden>
          <div class="campo">
            <label for="valorRessarcimento">Valor do ressarcimento</label>
            <input type="text" id="valorRessarcimento" value="0,01">
          </div>
          <div class="campo campo-largo">
            <label for="motivoZero">Motivo, se o valor for zero</label>
            <input type="text" id="motivoZero"
                   placeholder="mudança de gestão, acordo interno…">
          </div>
        </div>

        <div class="campo bloco">
          <label for="observacao">Observação (vai para a OBS da OS)</label>
          <input type="text" id="observacao">
        </div>

        <div id="blocoModelos" class="bloco" style="display:none">
          <div class="rotulo-bloco">
            Equipamento por placa</div>
          <table id="tabelaModelos"><thead></thead><tbody></tbody></table>
        </div>

        <div id="previaOS"></div>

        <div class="acoes">
          <button class="btn btn-ghost" onclick="conferirOS()">Ver prévia</button>
          <button class="btn btn-perigo" id="btnGerar" onclick="gerarOS()" disabled>
            Gerar as OS</button>
          <span id="progressoOS" class="dim-pequeno"></span>
        </div>
      </div>

      <div class="footer-nav">
        <button class="btn btn-ghost" id="btnVoltar" onclick="irPara(etapaAtual - 1)"
                style="visibility:hidden">← Voltar</button>
        <span id="faltaDica" class="falta-dica"></span>
        <button class="btn btn-primary" id="btnAvancar" onclick="irPara(etapaAtual + 1)">
          Avançar →
        </button>
      </div>
    </div>
  </main>
</div>

<!-- Modal: trocar o cliente. Clonado do `gerar_os.html`: mesma marcação,
     mesmas classes, mesmo comportamento de 3 caracteres e 400 ms. -->
<div class="modal-bg" id="modalCliente"
     onclick="if(event.target===this)fecharModal('modalCliente')">
  <div class="modal">
    <div class="modal-header"><h3>Buscar cliente no Harmonit</h3>
      <button onclick="fecharModal('modalCliente')">&#10005;</button></div>
    <input type="text" id="buscaCliente"
           placeholder="Nome, CNPJ ou CPF (mín. 3 caracteres)">
    <div class="modal-lista" id="clientesResultado"></div>
  </div>
</div>

<!-- Modal: buscar serviço. Também clonado -- o que existia aqui era um
     `<select>` repovoado a cada tecla, em que ninguém escolhia nada: o valor
     era o que calhasse de ficar em primeiro, e o id não aparecia. -->
<div class="modal-bg" id="modalServico"
     onclick="if(event.target===this)fecharModal('modalServico')">
  <div class="modal">
    <div class="modal-header"><h3>Buscar serviço no Harmonit</h3>
      <button onclick="fecharModal('modalServico')">&#10005;</button></div>
    <input type="text" id="buscaServico" placeholder="Nome do serviço">
    <div class="modal-lista" id="servicosResultado"></div>
  </div>
</div>

<script src="/painel/static/barra_status.js"></script>
<script src="/painel/static/sidebar.js"></script>
<script>
const token = localStorage.getItem('fpsl_painel_token');
if (!token) window.location.href = '/painel';
montarSidebar('operacoes');
function auth() { return { 'Authorization': 'Bearer ' + token }; }

/* 🚨 ESCAPA TUDO QUE VEM DE FORA. O `gerar_os.html` tem 26 chamadas de
   `escapeHtml` desde 15/07, e a tela de placas nasceu sem nenhuma em 17/08 --
   a lição registrada foi "tela nova se compara com a tela que já existe".
   Esta nasce com a função antes de existir conteúdo para escapar. */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

/* 🚨 NEM TODA RESPOSTA É JSON. Quando o nginx corta por tempo (504) ou o
   serviço cai (502), o corpo é uma PÁGINA HTML, e `res.json()` estoura
   "Unexpected token '<'" -- que foi o "erro json" que a operadora viu em
   14/08 e que não dizia nada sobre o que aconteceu. Lê como texto primeiro. */
async function lerResposta(res) {
  const bruto = await res.text();
  let corpo = null;
  try { corpo = JSON.parse(bruto); } catch (e) { corpo = null; }
  if (res.ok) return corpo;
  if (res.status === 401) { logout(); throw new Error('sessão expirada'); }
  if (res.status === 403) throw new Error('sem permissão para esta aba');
  if (res.status === 502 || res.status === 504) {
    throw new Error('o servidor passou do tempo. Nada foi gravado — tente de novo.');
  }
  throw new Error((corpo && corpo.detail) || `erro HTTP ${res.status}`);
}

/* ── navegação entre etapas ─────────────────────────────────────────────────
   🚨 A ORDEM É A REGRA, e é por isso que a aba existe. Dá para gerar OS de
   placa que não existe na WESO -- foi assim que a OS 16775 saiu sem
   equipamento e sem chip. Aqui a etapa N só abre com a N-1 concluída.

   🚨 ESTA TRAVA FICOU SOLTA DA F1 ATÉ 21/08. O comentário dizia "na F1 nada
   conclui nada, então está solta de propósito" e sobreviveu a cinco fases. Em
   21/08 o operador foi da etapa 1 direto para a 4 e a prévia devolveu 400
   "Nenhuma placa foi informada" -- o erro certo, na hora errada, depois de
   todo o trabalho. O registro prova: os dois lotes daquele dia estão em
   `etapa 1` com ZERO placas gravadas. */
let etapaAtual = 1;
const TOTAL_ETAPAS = 4;

/* O que ainda falta na etapa N. String vazia = concluída. A MESMA frase vai
   para a dica ao lado do botão, para o operador não descobrir o que falta só
   depois de clicar. */
function faltaNaEtapa(n) {
  const p = perfilAtual();
  if (n === 1) {
    if (!document.getElementById('perfil').value) return 'escolha o tipo';
    if (p.sem_termo) return '';
    if (!extraido) return 'suba o PDF do termo';
    if (!(extraido.itens || []).length) return 'o termo não trouxe placa';
    return '';
  }
  if (n === 2) {
    if (!cliente) return 'confira o cliente';
    if (cliente.situacao === 'sem_harmonit') return 'cliente não existe no Harmonit';
    if (cliente.situacao === 'falta_na_weso') return 'cadastre o cliente na WESO';
    return '';
  }
  if (n === 3) {
    if (!linhasPlacas.length) return 'informe ao menos uma placa';
    const semPassar = linhasPlacas.filter((l) => !l.situacao).length;
    if (semPassar) return `${semPassar} placa(s) pendentes`;
    const ruins = linhasPlacas.filter((l) => placaFalhou(l.situacao)).length;
    if (ruins) return `${ruins} placa(s) com falha`;
    return '';
  }
  return '';
}

/* Falha é o que impede a OS de sair correta: placa que o perfil manda CONFERIR
   e não achou, ou escrita recusada. `ja_existia` e `ignorado` NÃO são falha --
   trava que reprova o caminho certo ensina a ignorar a trava. */
function placaFalhou(s) {
  if (!s) return false;
  return ['harmonit', 'weso'].some(
    (sis) => s[sis] && ['confere_falta', 'falhou'].includes(s[sis].acao));
}

function irPara(n) {
  if (n < 1 || n > TOTAL_ETAPAS) return;
  /* Voltar é sempre livre: rever o que já se fez nunca estraga nada. Avançar
     confere TODAS as etapas anteriores, não só a de agora -- senão o salto de
     1 para 4 continuaria passando. */
  if (n > etapaAtual) {
    for (let i = 1; i < n; i++) {
      const falta = faltaNaEtapa(i);
      if (falta) {
        pintarEtapa(i);
        msg('msgEtapa' + i, escapeHtml(falta), 'msg-erro');
        atualizarAvancar();
        return;
      }
    }
  }
  pintarEtapa(n);
  if (n === 2 && !cliente) {
    /* Perfil sem termo não tem documento para cruzar sozinho -- quem escolhe é
       gente, pelo botão Buscar. Sem este recado a etapa 2 ficava em branco e
       parecia quebrada. */
    if (perfilAtual().sem_termo) {
      msg('msgEtapa2', 'Escolha o cliente em <strong>Buscar</strong>.', '');
    } else if (extraido) {
      conferirCliente();
    }
  }
  if (n === 3) prepararPlacas();
  if (n === 4) carregarApoio();
  atualizarAvancar();
}

function pintarEtapa(n) {
  etapaAtual = n;
  for (let i = 1; i <= TOTAL_ETAPAS; i++) {
    const painel = document.getElementById('panel-' + i);
    const bola = document.getElementById('dot-' + i);
    painel.classList.toggle('active', i === n);
    bola.classList.toggle('active', i === n);
    bola.classList.toggle('done', i < n && !faltaNaEtapa(i));
    bola.classList.toggle('locked', i > n);
  }
  document.getElementById('btnVoltar').style.visibility = n === 1 ? 'hidden' : 'visible';
  document.getElementById('btnAvancar').style.visibility =
    n === TOTAL_ETAPAS ? 'hidden' : 'visible';
}

/* O botão diz o que falta ANTES do clique. Botão que só reclama depois de
   clicado ensina a clicar para descobrir. */
function atualizarAvancar() {
  const btn = document.getElementById('btnAvancar');
  const dica = document.getElementById('faltaDica');
  if (!btn) return;
  const falta = faltaNaEtapa(etapaAtual);
  btn.disabled = !!falta;
  /* Curta, por escolha dele: duas ou tres palavras, nao frase. Botao
     desabilitado sem motivo foi a reclamacao do "botao conferir faz o que?". */
  if (dica) dica.textContent = falta;
}

/* ── etapa 1: os perfis ─────────────────────────────────────────────────────
   Vêm do servidor, nunca escritos aqui: a lista é `operacoes_config.PERFIS`, e
   duplicá-la no navegador criaria duas verdades. */
async function carregarPerfis() {
  try {
    const res = await fetch('/painel/api/operacoes/perfis', { headers: auth() });
    const d = await lerResposta(res);
    const sel = document.getElementById('perfil');
    sel.innerHTML = (d.perfis || [])
      .map((p) => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.label)}</option>`)
      .join('');
    perfisCarregados = d.perfis;
    sel.onchange = () => { zerarRodada(); pintarEtapa(1); mostrarPerfil(d.perfis); };
    mostrarPerfil(d.perfis);
  } catch (e) {
    msg('msgEtapa1', 'Não consegui carregar os tipos de operação: '
        + escapeHtml(e.message), 'msg-erro');
  }
}

/* Mostra o que o perfil escolhido implica, ANTES de o operador subir nada.
   É informação que hoje só aparece depois de errar. */
function mostrarPerfil(perfis) {
  const id = document.getElementById('perfil').value;
  const p = (perfis || []).find((x) => x.id === id);
  if (!p) return;
  /* Campo de PDF só existe para quem nasce de documento. */
  document.getElementById('anexoWrap').style.display = p.sem_termo ? 'none' : 'block';

  /* 🚨 COM TERMO, O DOCUMENTO MANDA E O CLIENTE NAO SE TROCA (decisao dele,
     21/08). Sem termo nao ha documento: a busca e a unica forma de ter
     cliente, e tirar o botao la mataria manutencao e ressarcimento sem termo
     de novo. */
  document.getElementById('btnBuscarCliente').style.display =
    p.sem_termo ? '' : 'none';
  atualizarAvancar();
}

/* 🚨 TROCAR O TIPO DE OPERAÇÃO ZERA A RODADA. Sem isto o termo lido para um
   perfil seguia valendo para outro: o operador trocava de Aditivo para
   Rescisão e a etapa 3 continuava com as placas do documento anterior, que
   têm regra diferente. O lote já aberto fica no registro como estava -- ele
   é histórico do que aconteceu, não rascunho. */
function zerarRodada() {
  extraido = null;
  cliente = null;
  lote = null;
  linhasPlacas = [];
  previa = null;
  document.getElementById('leitura').style.display = 'none';
  document.getElementById('cliente').style.display = 'none';
  document.getElementById('docWrap').style.display = 'none';
  document.getElementById('dropLabel').textContent =
    'Clique ou arraste o PDF do termo aqui';
  document.getElementById('arquivo').value = '';
  ['msgEtapa1', 'msgEtapa2', 'msgEtapa3', 'msgEtapa4'].forEach((id) => msg(id, '', ''));
  document.getElementById('btnGerar').disabled = true;
  document.getElementById('previaOS').innerHTML = '';
  servicoSelecionado = null;
  placasDoCliente = [];
  esquecerLote();
  document.getElementById('addPlacaWrap').style.display = 'none';
  document.getElementById('servicoCampo').value = '';
  document.getElementById('clienteCampo').value = '';
  document.getElementById('buscaCliente').value = '';
}

/* ── etapa 1: ler o termo ───────────────────────────────────────────────────
   🚨 A LEITURA NÃO CRUZA O CLIENTE, ao contrário da tela velha. Lá o mesmo
   endpoint lia o PDF e batia nos dois sistemas -- e é a consulta que oscila.
   Quando ela demora, a leitura do PDF, que é local e instantânea, demora
   junto e o operador fica olhando para nada. */
let perfisCarregados = [];
let extraido = null;

function aoEscolher() {
  const f = document.getElementById('arquivo').files[0];
  if (!f) return;
  document.getElementById('dropLabel').textContent = f.name;
  lerTermo();
}

/* ── espera com relógio ─────────────────────────────────────────────────────
   🚨 PEDIDO DO USUÁRIO, 21/08: "passando de 15 precisa ter um ícone indicando
   ou barra de progresso". A WESO responde entre 6 s e o teto, e sem nada na
   tela o operador conclui que travou e clica de novo -- que em operação de
   ESCRITA duplica, porque o pedido anterior continua correndo no servidor.

   Três estados, nesta ordem: nada até 3 s (a maioria das chamadas termina
   antes e piscar spinner à toa é ruído), contador de 3 s a 15 s, e barra a
   partir de 15 s. O `gerar_os.html` já tinha o contador de 3 s -- a barra é
   nova e vale para as duas telas quando o Gerar OS sair.

   ⚠️ A BARRA NÃO MEDE PROGRESSO DE VERDADE, e ela diz isso: ninguém sabe
   quanto falta numa chamada da WESO. Ela mostra o decorrido contra o teto de
   60 s. Barra que finge saber o que não sabe mente na última fatia. */
const TETO_ESPERA_S = 60;

function iniciarEspera(idAlvo, oque) {
  const el = document.getElementById(idAlvo);
  if (!el) return () => {};
  const t0 = Date.now();
  el.style.display = 'block';
  el.className = 'msg espera';
  const tick = () => {
    const s = Math.floor((Date.now() - t0) / 1000);
    if (s < 3) { el.innerHTML = ''; return; }
    if (s < 15) {
      el.innerHTML = `${escapeHtml(oque)}… <strong>${s}s</strong> ` +
        '<span class="spinner"></span>';
      return;
    }
    const pct = Math.min(100, Math.round((s / TETO_ESPERA_S) * 100));
    el.innerHTML = `${escapeHtml(oque)}… <strong>${s}s</strong>` +
      `<div class="barra"><div class="barra-cheia" style="width:${pct}%"></div></div>`;
  };
  tick();
  const timer = setInterval(tick, 1000);
  return () => { clearInterval(timer); el.innerHTML = ''; el.style.display = 'none'; };
}

function msg(id, texto, classe) {
  const el = document.getElementById(id);
  el.style.display = texto ? 'block' : 'none';
  el.className = 'msg ' + (classe || '');
  el.innerHTML = texto || '';
}

async function lerTermo() {
  const f = document.getElementById('arquivo').files[0];
  if (!f) return;
  const perfil = document.getElementById('perfil').value;
  msg('msgEtapa1', 'Lendo o termo… <span class="spinner"></span>', '');
  document.getElementById('leitura').style.display = 'none';
  try {
    const corpo = new FormData();
    corpo.append('arquivo', f);
    const res = await fetch(
      `/painel/api/operacoes/extrair?perfil=${encodeURIComponent(perfil)}`,
      { method: 'POST', headers: auth(), body: corpo });
    extraido = await lerResposta(res);
    /* Termo novo e rodada nova: o que estava montado era do documento
       anterior. Este e um dos dois casos que zeram a lista de propósito -- o
       outro e trocar de perfil. Voltar uma etapa NAO e. */
    linhasPlacas = [];
    lote = null;

    /* 🚨 A RETOMADA SE FECHA AQUI. Se o termo que acabou de subir e o mesmo do
       lote pendente, reusa o lote em vez de abrir outro -- e e isso que faz o
       registro continuar a mesma rodada em vez de comecar uma paralela. */
    if (retomando && String(retomando.termo || '') === String(extraido.termo || '')) {
      lote = retomando.lote;
      /* Renova o carimbo: a rodada continua AGORA, nao quando ela comecou.
         Sem isto uma rodada retomada perto das 24h expiraria no meio dela. */
      guardarLote();
    }
    desenharLeitura(extraido);
    msg('msgEtapa1', '', '');
  } catch (e) {
    extraido = null;
    msg('msgEtapa1', escapeHtml(e.message), 'msg-erro');
    atualizarAvancar();
  }
}

function desenharLeitura(d) {
  const r = d.resumo || {};
  const partes = [`termo <strong>${escapeHtml(d.termo || '—')}</strong>`,
                  `<strong>${r.veiculos}</strong> veículo(s)`];
  if (r.nao_convencionais) partes.push(`${r.nao_convencionais} por chassi ou série`);
  if (r.sem_descricao) partes.push(`<strong>${r.sem_descricao} sem descrição</strong>`);
  if (d.recipiente_sufixo) partes.push(`recipiente <code>${escapeHtml(d.recipiente_sufixo)}</code>`);
  document.getElementById('leituraResumo').innerHTML = partes.join(' · ');

  /* 🚨 O QUE NÃO FOI LIDO APARECE, e em vermelho. Item que o sistema não
     entende precisa ser visto: quem decide o que fazer com ele é gente. Foi
     de texto solto assim que nasceu a `RFD 2447`, placa que não existe. */
  const naoLidos = d.sem_placa || [];
  document.getElementById('leituraNaoLidos').innerHTML = !naoLidos.length ? '' :
    `<div class="msg msg-erro bloco">` +
    `<strong>${naoLidos.length} linha(s) sem placa reconhecida:</strong><br>` +
    naoLidos.map((x) => `<code>${escapeHtml(x.texto || x)}</code>`).join(' · ') +
    `</div>`;

  /* 🚨 A TABELA DE PLACAS SAIU DAQUI EM 21/08 (pedido seu). A etapa 1 diz o que
     o TERMO traz; a placa é assunto da etapa 3, e ela é editável lá. Duas
     tabelas com a mesma informação, uma delas só de leitura, ensinavam que a
     etapa 3 era repetição -- e a etapa 1 ficava com cara de lugar onde se
     corrige placa, que não é.

     O que NÃO saiu: as linhas sem placa reconhecida, logo acima. Elas não são
     resumo, são o aviso de que o documento tem coisa que ninguém leu. */

  /* As duas taxas vêm DO TERMO, não fixadas em código -- valor de serviço em
     código apodrece igual a id de tipo. Aparecem aqui para conferência. */
  if (d.taxa_local_diferente || d.taxa_mesmo_local) {
    document.getElementById('leituraResumo').innerHTML +=
      `<br>Taxas no termo · mesmo local <strong>${escapeHtml(d.taxa_mesmo_local || '—')}</strong>` +
      ` · local diferente <strong>${escapeHtml(d.taxa_local_diferente || '—')}</strong>`;
  }
  document.getElementById('leitura').style.display = 'block';

  /* 🚨 SEM PLACA, O ERRO É AQUI (pedido seu, 21/08). Até hoje ele só aparecia
     na etapa 4, como 400 "Nenhuma placa foi informada" -- o erro certo depois
     de todo o trabalho. O termo que não traz veículo nenhum não avança. */
  if (!(d.itens || []).length) {
    msg('msgEtapa1',
        '<strong>Este termo foi lido e não trouxe nenhuma placa.</strong> ' +
        'Não há operação possível a partir dele — confira se o documento é o ' +
        'certo para o tipo escolhido.', 'msg-erro');
  }
  atualizarAvancar();
}

/* ── etapa 2: o cliente ─────────────────────────────────────────────────────
   🚨 CRUZA POR DOCUMENTO, NUNCA POR NOME, e mostra os DOIS nomes. O mesmo CNPJ
   é `Velasco Leite Pastelaria ME` no Harmonit e `PASTELARIA VELASCO LTDA` na
   WESO -- mostrar um só faz parecer que achou o cliente errado. */
let cliente = null;
/* A marca "trocado na mao" saiu em 21/08 junto com a troca em perfil com
   termo: onde ela ainda acontece -- perfis sem termo -- nao ha nada de que se
   desviar, porque nao havia cliente antes. */

function abrirModal(id) { document.getElementById(id).classList.add('open'); }
function fecharModal(id) { document.getElementById(id).classList.remove('open'); }

/* ── trocar o cliente ───────────────────────────────────────────────────────
   🚨 A TROCA VOLTA PELO MESMO CAMINHO DO TERMO. Escolher na lista NÃO grava o
   cliente direto: grava o DOCUMENTO dele e refaz `conferirCliente()`. Assim a
   tabela dos dois sistemas continua sendo a única fonte do que a tela mostra,
   e o cruzamento continua sendo por documento -- cruzar por nome é proibido, e
   o mesmo CNPJ tem razão social diferente no Harmonit e na WESO. */
function abrirModalCliente() {
  abrirModal('modalCliente');
  const campo = document.getElementById('buscaCliente');
  if (!campo.value && extraido && extraido.nome_no_termo) {
    campo.value = extraido.nome_no_termo;
  }
  if ((campo.value || '').length >= 3) buscarCliente(campo.value);
}

let buscaClienteTimer;
document.getElementById('buscaCliente').addEventListener('input', (e) => {
  clearTimeout(buscaClienteTimer);
  buscaClienteTimer = setTimeout(() => buscarCliente(e.target.value), 400);
});

async function buscarCliente(q) {
  const div = document.getElementById('clientesResultado');
  /* Mínimo de 3, igual ao Gerar OS: `search` de uma letra devolve a base
     inteira com cara de resposta útil. */
  if ((q || '').trim().length < 3) {
    div.innerHTML = '<div class="aviso">Digite ao menos 3 caracteres.</div>';
    return;
  }
  div.innerHTML = 'Buscando… <span class="spinner"></span>';
  try {
    const res = await fetch(
      '/painel/api/operacoes/clientes/buscar?q=' + encodeURIComponent(q),
      { headers: auth() });
    const d = await lerResposta(res);
    const achados = d.resultados || [];
    if (!achados.length) {
      div.innerHTML = '<div class="aviso">Nenhum cliente encontrado.</div>';
      return;
    }
    div.innerHTML = '';
    achados.forEach((c) => {
      const el = document.createElement('div');
      el.className = 'modal-item';
      el.innerHTML = `<span>${escapeHtml(c.nome || '(sem nome)')}</span>` +
        `<span class="dim">${escapeHtml(c.documento || '')} · #${escapeHtml(String(c.id))}</span>`;
      el.onclick = () => escolherCliente(c);
      div.appendChild(el);
    });
  } catch (e) {
    div.innerHTML = `<div class="msg msg-erro">${escapeHtml(e.message)}</div>`;
  }
}

function escolherCliente(c) {
  /* 🚨 SEM DOCUMENTO NÃO DÁ PARA CRUZAR. O cadastro do Harmonit pode estar sem
     CNPJ/CPF, e aí não há como procurar na WESO -- e inventar o cruzamento é
     pior que não fazer. */
  const doc = (c.documento || '').replace(/\D/g, '');
  if (!doc) {
    fecharModal('modalCliente');
    msg('msgEtapa2',
        `<strong>${escapeHtml(c.nome || '')}</strong> está no Harmonit sem ` +
        'CNPJ/CPF no cadastro. Sem documento não há como cruzar com a WESO — ' +
        'corrija o cadastro lá antes de seguir.', 'msg-erro');
    return;
  }
  fecharModal('modalCliente');
  if (!extraido) extraido = {};
  extraido.documento = doc;
  conferirCliente();
}

function usarDocDigitado() {
  const v = (document.getElementById('docDigitado').value || '').trim();
  if (!v) { msg('msgEtapa2', 'Informe o documento.', 'msg-erro'); return; }
  extraido.documento = v;
  conferirCliente();
}

async function conferirCliente() {
  if (!extraido) {
    msg('msgEtapa2', 'Leia o termo na etapa 1 primeiro.', 'msg-erro');
    return;
  }
  /* O termo sem documento não é erro -- é o caso da rescisão. Pede e para. */
  if (!extraido.documento) {
    document.getElementById('nomeNoTermo').textContent = extraido.nome_no_termo || '—';
    document.getElementById('docWrap').style.display = 'block';
    return;
  }
  document.getElementById('docWrap').style.display =
    extraido.documento_no_termo ? 'none' : 'block';
  const pararEspera = iniciarEspera('msgEtapa2', 'Consultando os dois sistemas');
  document.getElementById('cliente').style.display = 'none';
  try {
    const res = await fetch(
      `/painel/api/operacoes/cliente?documento=${encodeURIComponent(extraido.documento)}`,
      { headers: auth() });
    cliente = await lerResposta(res);
    pararEspera();
    desenharCliente(cliente);
    msg('msgEtapa2', '', '');
  } catch (e) {
    cliente = null;
    pararEspera();
    msg('msgEtapa2', escapeHtml(e.message), 'msg-erro');
  }
  atualizarAvancar();
}

function desenharCliente(d) {
  const linha = (sis, dados) => `<tr>
    <td><strong>${sis}</strong></td>
    <td>${dados ? escapeHtml(dados.nome || '—')
                : '<span class="badge badge-red">não existe</span>'}</td>
    <td>${dados ? escapeHtml(String(dados.id)) : '—'}</td>
  </tr>`;
  document.getElementById('clienteCorpo').innerHTML =
    `<tr><td><strong>No termo</strong></td><td>${escapeHtml(extraido.nome_no_termo || '—')}</td><td>—</td></tr>` +
    linha('Harmonit', d.harmonit) + linha('WESO', d.weso);

  /* O campo do topo diz, numa linha, quem é o cliente confirmado -- é o que
     o operador lê antes de seguir, sem ter de interpretar a tabela. */
  const nome = (d.harmonit && d.harmonit.nome) || (d.weso && d.weso.nome) || '';
  const idh = (d.harmonit && d.harmonit.id) ? ` (#${d.harmonit.id})` : '';
  document.getElementById('clienteCampo').value = nome ? nome + idh : '';
  const classe = { ok: 'msg-ok', falta_na_weso: 'aviso', sem_harmonit: 'msg msg-erro' }[d.situacao];
  document.getElementById('clienteRecado').innerHTML =
    `<div class="${classe}">${escapeHtml(d.recado)}</div>`;

  /* Só o caminho que existe vira botão. `sem_harmonit` não tem botão porque
     não há ação possível daqui -- o painel nunca cria cliente no Harmonit. */
  document.getElementById('clienteAcao').innerHTML = d.situacao !== 'falta_na_weso' ? '' :
    `<button class="btn btn-primary" id="btnCriarCliente" onclick="criarClienteNaWeso()">
       Cadastrar na WESO com os dados do Harmonit
     </button>`;
}

async function criarClienteNaWeso() {
  const btn = document.getElementById('btnCriarCliente');
  btn.disabled = true; btn.textContent = 'Cadastrando…';
  try {
    const res = await fetch('/painel/api/operacoes/cliente/criar-na-weso', {
      method: 'POST',
      headers: { ...auth(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ documento: extraido.documento }),
    });
    const d = await lerResposta(res);
    msg('msgEtapa2',
        d.acao === 'criado'
          ? `Cliente criado na WESO (id ${escapeHtml(String(d.id))}) e conferido relendo.`
          : `O cliente já existia na WESO (id ${escapeHtml(String(d.id))}).`,
        'msg-ok');
    await conferirCliente();
  } catch (e) {
    msg('msgEtapa2', escapeHtml(e.message), 'msg-erro');
    btn.disabled = false;
    btn.textContent = 'Cadastrar na WESO com os dados do Harmonit';
  }
}

/* ⚠️ O que entrar ao chegar em cada etapa mora dentro do `irPara`, uma vez só.
   Até 21/08 havia DOIS `irPara = function(...)` reatribuindo a função depois
   de declarada, um na etapa 2 e outro na 4. Encadeamento assim esconde a
   ordem de execução e foi o que deixou a trava passar despercebida. */

/* ── etapa 3: as placas ─────────────────────────────────────────────────────
   🚨 UMA REQUISIÇÃO POR PLACA, NÃO LOTE. Medido em 17/08: gravar custa ~4s por
   placa, porque cada uma escreve em dois sistemas e é RELIDA nos dois. Um lote
   de 11 numa requisição só passa do `proxy_read_timeout` do nginx e a tela
   morre sem dizer o que chegou a acontecer.

   🚨 E É POR ISSO QUE O LOTE EXISTE. Caindo no meio, o que já nasceu está
   registrado: a próxima rodada pula o resolvido em vez de tentar recriar e
   tomar 409. */
let lote = null;
let linhasPlacas = [];
let placasDoCliente = [];

/* 🚨 ID ESTAVEL POR LINHA, e nao indice. O botao ⇄ troca veiculo com placa e o
   ✕ remove linha do meio da lista -- qualquer chave posicional quebra junto.
   A linha de ENTRADA da substituicao aponta para a de SAIDA por `origem`, e e
   assim que a `corpoOS` monta o par. Antes ela casava pelo TEXTO do veiculo, e
   na substituicao os dois veiculos sao diferentes por definicao: o equipamento
   muda de carro. */
/* ── retomar ────────────────────────────────────────────────────────────────
   A chave fica no navegador porque e do operador, nao do servidor: e ele que
   estava no meio de uma rodada. O servidor ja sabe o que aconteceu no lote --
   o que faltava era alguem perguntar. */
const CHAVE_LOTE = 'fpsl_operacoes_lote';

function guardarLote() {
  if (!lote) return;
  try {
    localStorage.setItem(CHAVE_LOTE, JSON.stringify({
      lote,
      perfil: document.getElementById('perfil').value,
      termo: (extraido && extraido.termo) || null,
      documento: (extraido && extraido.documento) || null,
      quando: Date.now(),
    }));
  } catch (e) { /* navegador sem storage nao impede trabalhar */ }
}

function esquecerLote() {
  try { localStorage.removeItem(CHAVE_LOTE); } catch (e) { /* idem */ }
}

function lotePendente() {
  try {
    const cru = localStorage.getItem(CHAVE_LOTE);
    if (!cru) return null;
    const d = JSON.parse(cru);
    /* Mais de 24h nao e "rodada em andamento", e lixo. */
    if (!d || !d.lote || (Date.now() - (d.quando || 0)) > 86400000) {
      esquecerLote();
      return null;
    }
    return d;
  } catch (e) { return null; }
}

let retomando = null;

async function oferecerRetomada() {
  const d = lotePendente();
  if (!d) return;
  let resumo = null;
  try {
    const r = await fetch('/painel/api/operacoes/lote/' + encodeURIComponent(d.lote),
                          { headers: auth() });
    resumo = await lerResposta(r);
  } catch (e) {
    /* Lote que o servidor nao conhece mais nao serve para nada. */
    esquecerLote();
    return;
  }
  const feitas = Object.keys(resumo.resolvidas || {}).length;
  if (!feitas) { esquecerLote(); return; }

  retomando = { ...d, resolvidas: resumo.resolvidas || {} };
  document.getElementById('retomarTexto').innerHTML =
    `Rodada em andamento — termo <strong>${escapeHtml(d.termo || '—')}</strong>, ` +
    `<strong>${feitas}</strong> placa(s) já resolvida(s).`;
  document.getElementById('barraRetomar').style.display = '';
}

function retomarLote() {
  if (!retomando) return;
  document.getElementById('perfil').value = retomando.perfil;
  mostrarPerfil(perfisCarregados);
  document.getElementById('barraRetomar').style.display = 'none';
  msg('msgEtapa1',
      `Suba o termo <strong>${escapeHtml(retomando.termo || '')}</strong> de novo.`, '');
}

function descartarLote() {
  esquecerLote();
  retomando = null;
  document.getElementById('barraRetomar').style.display = 'none';
}

/* Marca como resolvido o que o registro do lote diz que ja terminou. Sem isto
   a retomada seria so reabrir a tela: as linhas voltariam sem badge e o
   operador clicaria em Cadastrar de novo. */
function aplicarResolvidas(resolvidas) {
  let n = 0;
  linhasPlacas.forEach((l) => {
    const sistemas = resolvidas[l.placa];
    if (!sistemas || !sistemas.length) return;
    l.situacao = {};
    sistemas.forEach((sis) => { l.situacao[sis] = { acao: 'ja_existia' }; });
    n += 1;
  });
  return n;
}

let proximaLinha = 1;
function novaLinha(dados) {
  return Object.assign({ id: proximaLinha++, recipiente: false, entrada: false,
                         situacao: null }, dados);
}

function perfilAtual() {
  const id = document.getElementById('perfil').value;
  return (perfisCarregados || []).find((p) => p.id === id) || {};
}

async function prepararPlacas() {
  const p = perfilAtual();
  const cria = p.etapa_placas !== 'confere';

  /* 🚨 PERFIL SEM TERMO NÃO TEM `extraido`, E ISSO NÃO É ERRO. Até 21/08 esta
     função começava com "Leia o termo na etapa 1 primeiro" e voltava -- o que
     matava manutenção no local, manutenção com troca e ressarcimento sem
     termo. A etapa 1 desses perfis prometia, na própria tela, que "a entrada
     digitada entra na F3"; a F3 nunca construiu a entrada. */
  if (p.sem_termo) {
    document.getElementById('addPlacaWrap').style.display = 'block';
    await carregarPlacasDoCliente();
    if (!linhasPlacas.length) desenharPlacas();
    document.getElementById('btnPlacas').textContent = cria ? 'Cadastrar' : 'Conferir';
    await garantirLote();
    atualizarAvancar();
    return;
  }
  document.getElementById('addPlacaWrap').style.display = 'none';

  if (!extraido) {
    msg('msgEtapa3', 'Leia o termo na etapa 1 primeiro.', 'msg-erro');
    return;
  }

  /* 🚨 SO MONTA SE AINDA NAO HA LINHA. Ate 21/08 esta funcao fazia
     `linhasPlacas = []` e reconstruia TODA vez que a etapa 3 abria -- e ela
     abre a cada `irPara(3)`. Medido: grava 2 placas nos dois sistemas, volta
     para a etapa 2, retorna, e a `situacao` das duas some. O operador clicaria
     em Cadastrar de novo e tentaria RECRIAR o que existe.

     O que zera a lista e trocar de perfil (`zerarRodada`) ou subir outro termo
     (`lerTermo`) -- os dois casos em que a rodada realmente recomeca. Voltar
     uma etapa nao e um deles. */
  if (!linhasPlacas.length) {
    montarLinhasDoTermo();
    if (retomando && lote === retomando.lote) {
      const n = aplicarResolvidas(retomando.resolvidas);
      if (n) {
        msg('msgEtapa3',
            `<strong>${n} placa(s)</strong> já resolvidas nesta rodada.`, 'msg-ok');
      }
      retomando = null;
    }
  }

  document.getElementById('btnPlacas').textContent = cria ? 'Cadastrar' : 'Conferir';
  desenharPlacas();

  if (!lote) {
    const res = await fetch('/painel/api/operacoes/lote', {
      method: 'POST', headers: { ...auth(), 'Content-Type': 'application/json' },
      /* 🚨 O CLIENTE VAI JUNTO. Ele foi resolvido na etapa 2 e o lote nasce
         agora; sem mandar aqui, `cliente_harmonit_id` e `cliente_weso_id`
         ficam nulos no registro para sempre -- foi o que aconteceu com os
         dois lotes de 21/08, e o Histórico de Operações lê essas colunas. */
      body: JSON.stringify({ perfil: document.getElementById('perfil').value,
                             termo: extraido.termo, documento: extraido.documento,
                             cliente_harmonit_id: (cliente && cliente.harmonit)
                               ? cliente.harmonit.id : null,
                             cliente_weso_id: (cliente && cliente.weso)
                               ? cliente.weso.id : null }),
    });
    lote = (await lerResposta(res)).lote;
    guardarLote();
  }
}

/* 🚨 O RECIPIENTE ENTRA COMO LINHA PROPRIA, e so na WESO. Ele e bancada do
   setor de configuracao, nao veiculo do cliente. Deixa-lo implicito foi o que
   fez a manutencao depender de leitura ao vivo por meses. */
function montarLinhasDoTermo() {
  linhasPlacas = [];
  (extraido.itens || []).forEach((i) => {
    const saida = novaLinha({ veiculo: i.veiculo, placa: i.placa_gravada });
    linhasPlacas.push(saida);

    /* A linha de entrada guarda de QUAL saida ela e o destino. E o unico
       vinculo confiavel: veiculo e placa sao editaveis na tabela. */
    if (i.placa_entrada_gravada) {
      linhasPlacas.push(novaLinha({ veiculo: i.veiculo_entrada,
                                    placa: i.placa_entrada_gravada,
                                    entrada: true, origem: saida.id }));
    }
    if (extraido.recipiente_sufixo) {
      linhasPlacas.push(novaLinha({
        veiculo: '(bancada)',
        placa: i.placa_gravada.replace(/\s+/g, '') + extraido.recipiente_sufixo,
        recipiente: true, origem: saida.id }));
    }
  });
}

/* ── perfis sem termo: as placas vêm da base local ──────────────────────────
   🚨 DA BASE LOCAL, NÃO AO VIVO. Nem o Harmonit nem a WESO filtram por cliente
   -- `ObterVeiculos` ignora `clienteId` e o `Consultar` da WESO ignora
   `cliente_id`, devolvendo a base inteira com cara de resposta válida. Listar
   ao vivo custaria a base toda a cada abertura da etapa.

   A decisão de usar a base é do usuário e tem razão dele: estes perfis são
   manutenção e ressarcimento, "só de placas que já existem na base a mais de 24
   horas". O sync do Harmonit roda de 12 em 12 h, então é margem dobrada. */
async function carregarPlacasDoCliente() {
  const sel = document.getElementById('placaDoCliente');
  const id = (cliente && cliente.harmonit) ? cliente.harmonit.id : null;
  if (!id) {
    sel.innerHTML = '<option value="">(escolha o cliente na etapa 2)</option>';
    return;
  }
  try {
    const r = await fetch(
      '/painel/api/operacoes/placas/do-cliente?cliente_harmonit_id=' + encodeURIComponent(id),
      { headers: auth() });
    const d = await lerResposta(r);
    placasDoCliente = d.veiculos || [];
    sel.innerHTML = placasDoCliente.length
      ? placasDoCliente.map((v, n) =>
          `<option value="${n}">${escapeHtml(v.placa)} — ${escapeHtml(v.veiculo || '')}</option>`).join('')
      : '<option value="">(este cliente não tem veículo na base)</option>';
  } catch (e) {
    sel.innerHTML = '<option value="">(não consegui ler a base)</option>';
  }
}

/* Adiciona UMA linha. O usuário pediu explicitamente "mesmo adicionando mais de
   uma", então o botão não some depois do primeiro clique. */
function adicionarPlaca() {
  const sel = document.getElementById('placaDoCliente');
  const v = placasDoCliente[+sel.value];
  if (!v) {
    msg('msgEtapa3', 'Escolha um veículo da lista.', 'msg-erro');
    return;
  }
  lerCampos();
  if (linhasPlacas.some((l) => !l.recipiente && l.placa === v.placa)) {
    msg('msgEtapa3', `A placa ${escapeHtml(v.placa)} já está na lista.`, 'aviso');
    return;
  }
  const saida = novaLinha({ veiculo: v.veiculo, placa: v.placa });
  linhasPlacas.push(saida);

  /* 🚨 O RECIPIENTE ACOMPANHA A PLACA, igual ao caminho do termo. A manutenção
     com troca tem sufixo `-MANUT`, e ele nasce NA TELA desde 19/08 -- é o que
     tirou a leitura ao vivo da WESO do caminho crítico. */
  const p = perfilAtual();
  if (p.recipiente) {
    linhasPlacas.push(novaLinha({ veiculo: '(bancada)',
                                  placa: v.placa.replace(/\s+/g, '') + p.recipiente,
                                  recipiente: true, origem: saida.id }));
  }
  msg('msgEtapa3', '', '');
  desenharPlacas();
  atualizarAvancar();
}

/* Sem remover, um clique errado só se desfaz trocando o tipo de operação e
   recomeçando -- que é o que a trava de etapas acabou de tornar caro. */
function removerPlaca(n) {
  lerCampos();
  const alvo = linhasPlacas[n];
  if (!alvo) return;
  /* 🚨 LEVA JUNTO O QUE DEPENDE DELA: recipiente e placa de entrada nao
     existem sozinhos. Antes isto comparava o TEXTO da placa com `startsWith`,
     que erra assim que alguem edita o campo -- e ele e editavel. Agora e o
     `origem`, que nao muda quando o texto muda. */
  linhasPlacas = linhasPlacas.filter(
    (l) => l.id !== alvo.id && l.origem !== alvo.id);
  desenharPlacas();
  atualizarAvancar();
}

async function garantirLote() {
  if (lote) return;
  const res = await fetch('/painel/api/operacoes/lote', {
    method: 'POST', headers: { ...auth(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ perfil: document.getElementById('perfil').value,
                           termo: (extraido && extraido.termo) || null,
                           documento: (extraido && extraido.documento) || null,
                           cliente_harmonit_id: (cliente && cliente.harmonit)
                             ? cliente.harmonit.id : null,
                           cliente_weso_id: (cliente && cliente.weso)
                             ? cliente.weso.id : null }),
  });
  lote = (await lerResposta(res)).lote;
  guardarLote();
}

function desenharPlacas() {
  document.getElementById('cabPlacas').innerHTML = `<tr>
    <th class="col-num">#</th><th>Veículo</th><th>Placa</th>
    <th class="col-troca">⇄</th><th class="col-situacao">Situação</th></tr>`;
  document.querySelector('#tabelaPlacas tbody').innerHTML = linhasPlacas
    .map((l, n) => `<tr>
      <td>${n + 1}${l.recipiente
        ? ' <span class="badge badge-ambar">bancada · só WESO</span>' : ''}${
        l.entrada ? ' <span class="badge badge-ambar">entra</span>' : ''}</td>
      <td><input type="text" data-campo="veiculo" data-linha="${n}"
                 value="${escapeHtml(l.veiculo || '')}"></td>
      <td><input type="text" data-campo="placa" data-linha="${n}"
                 value="${escapeHtml(l.placa || '')}"></td>
      <td>${l.recipiente ? '' :
        `<button class="btn btn-ghost btn-mini" onclick="inverter(${n})">⇄</button>` +
        (perfilAtual().sem_termo
          ? ` <button class="btn btn-ghost btn-mini" onclick="removerPlaca(${n})">✕</button>`
          : '')}</td>
      <td id="sit-${n}">${situacaoHtml(l.situacao)}</td>
    </tr>`).join('');
}

/* Inverter é por LINHA, não global: o erro contratual costuma ser em algumas
   linhas, não no documento inteiro. */
function inverter(n) {
  lerCampos();
  const l = linhasPlacas[n];
  [l.veiculo, l.placa] = [l.placa, l.veiculo];
  desenharPlacas();
}

function lerCampos() {
  document.querySelectorAll('#tabelaPlacas input').forEach((el) => {
    linhasPlacas[+el.dataset.linha][el.dataset.campo] = el.value;
  });
}

function situacaoHtml(s) {
  if (!s) return '<span class="dim">—</span>';
  const cor = { criado: 'badge-green', ja_existia: 'badge-blue',
                confere_ok: 'badge-green', confere_falta: 'badge-red',
                falhou: 'badge-red', ignorado: 'badge-blue' };
  return ['harmonit', 'weso'].map((sis) => {
    const r = s[sis];
    if (!r) return '';
    return `<div class="mini"><strong>${sis}</strong> ` +
      `<span class="badge ${cor[r.acao] || 'badge-blue'}">${escapeHtml(r.acao)}</span> ` +
      escapeHtml(r.erro || r.motivo || '') + `</div>`;
  }).join('');
}

async function processarPlacas() {
  lerCampos();
  const p = perfilAtual();

  /* 🚨 CONFIRMA SO QUANDO ESCREVE (decisao dele, 21/08: "as duas confirmam").
     O que pesa aqui e que o Harmonit NAO TEM DELETE DE VEICULO -- placa criada
     por engano fica. Nos perfis `confere` a etapa 3 so le, e perguntar ali
     ensinaria a clicar em OK sem ler. */
  if (p.etapa_placas !== 'confere') {
    /* 🚨 PENDENTE = nunca tentada OU falhou. Placa que falhou TEM `situacao`,
       e contar so `!l.situacao` fazia a funcao voltar sem fazer nada -- sem
       poder repetir justamente a que precisa. O servidor ja diz isso no
       `ja_resolvidas`: "falhou nao entra, a graca e tentar de novo". */
    const pendentes = linhasPlacas.filter(
      (l) => !l.situacao || placaFalhou(l.situacao));
    if (!pendentes.length) return;

    /* 🚨 OS DOIS DESTINOS SAO DIFERENTES, e a caixa tem de dizer qual e qual.
       O recipiente (`-MANUT`, `-UPGRADE`) e bancada do setor de configuracao,
       nao veiculo do cliente: ele nasce SO na WESO. Ate hoje esta caixa dizia
       "N registro(s) no Harmonit e na WESO" contando os dois tipos juntos --
       e foi o que fez parecer que a manutencao ia criar recipiente no
       Harmonit. */
    const veiculos = pendentes.filter((l) => !l.recipiente).length;
    const bancadas = pendentes.filter((l) => l.recipiente).length;
    const partes = [];
    if (veiculos) partes.push(`${veiculos} veículo(s) no Harmonit e na WESO`);
    if (bancadas) partes.push(`${bancadas} recipiente(s) SÓ na WESO`);
    if (!confirm(
        `Criar ${partes.join('\ne ')}?\n\n` +
        `O Harmonit nao tem exclusao de veiculo: o que for criado por engano fica.`)) {
      return;
    }
  }

  const btn = document.getElementById('btnPlacas');
  btn.disabled = true;
  const prog = document.getElementById('progressoPlacas');
  msg('msgEtapa3', '', '');

  /* 🚨 SEQUENCIAL, NÃO EM PARALELO. Disparar 11 de uma vez contra a WESO,
     que já oscila entre 6s e timeout, é a receita para metade falhar por
     tempo -- e falha por tempo é a pior, porque pode ter gravado. */
  /* Nao refaz o que ja terminou bem: o que ja esta la nao precisa de outra
     escrita, e repetir escrita apos timeout duplica. */
  const pendentes = linhasPlacas
    .map((l, n) => ({ l, n }))
    .filter(({ l }) => !l.situacao || placaFalhou(l.situacao));

  for (let k = 0; k < pendentes.length; k++) {
    const { l, n } = pendentes[k];
    prog.innerHTML = `${k + 1} de ${pendentes.length} · ${escapeHtml(l.placa)} <span class="spinner"></span>`;
    try {
      const res = await fetch('/painel/api/operacoes/placas/uma', {
        method: 'POST', headers: { ...auth(), 'Content-Type': 'application/json' },
        body: JSON.stringify({
          lote, placa: l.placa, descricao: l.veiculo, recipiente: !!l.recipiente,
          cliente_harmonit_id: (cliente && cliente.harmonit) ? cliente.harmonit.id : null,
          documento: extraido.documento,
        }),
      });
      l.situacao = await lerResposta(res);
    } catch (e) {
      l.situacao = { weso: { acao: 'falhou', erro: e.message } };
    }
    document.getElementById(`sit-${n}`).innerHTML = situacaoHtml(l.situacao);
  }
  prog.textContent = '';
  btn.disabled = false;

  /* Uma definição só de "falhou", compartilhada com a trava de etapas. Duas
     listas de `acao` em dois lugares divergem na primeira vez que alguém
     acrescentar um estado novo. */
  const ruins = linhasPlacas.filter((l) => placaFalhou(l.situacao));
  /* So o erro fala. O sucesso ja esta nos badges verdes da coluna Situacao --
     repeti-lo em prosa e dizer duas vezes a mesma coisa. */
  msg('msgEtapa3', ruins.length
      ? `<strong>${ruins.length} linha(s) com problema.</strong> Corrija e clique de novo.`
      : '', ruins.length ? 'msg-erro' : '');
  atualizarAvancar();
}

/* ── etapa 4: as OS ─────────────────────────────────────────────────────────
   🚨 MOSTRA O QUE VAI SER GRAVADO, NAO O QUE FOI DIGITADO. A previa e a
   gravacao chamam a MESMA montagem no servidor; esta tela so desenha o que
   voltou. Previa que remonta o resultado por conta propria e previa que mente,
   e ela e a ultima coisa que a pessoa ve antes de escrever em dois sistemas. */
let modelosDePara = [];
let previa = null;
let apoioCarregado = false;

async function carregarApoio() {
  if (apoioCarregado) return;
  apoioCarregado = true;
  try {
    const r = await fetch('/painel/api/operacoes/modelos', { headers: auth() });
    modelosDePara = (await lerResposta(r)).modelos || [];
  } catch (e) { modelosDePara = []; }

  try {
    const r = await fetch('/painel/api/operacoes/prioridades', { headers: auth() });
    const d = await lerResposta(r);
    const sel = document.getElementById('prioridadeId');
    sel.innerHTML = (d.prioridades || [])
      .map((p) => `<option value="${p.id}"${p.id === d.default ? ' selected' : ''}>` +
                  `${escapeHtml(p.descricao || '')}</option>`).join('');
    if (!sel.innerHTML) sel.innerHTML = `<option value="${d.default}">Normal</option>`;
  } catch (e) {
    /* Lista muda nao trava a tela: cai no padrao Normal, que e o que a
       esmagadora maioria das OS usa. */
    document.getElementById('prioridadeId').innerHTML = '<option value="382">Normal</option>';
  }

  /* `hibrida` é o que marca os dois ressarcimentos, com e sem termo. */
  document.getElementById('blocoRessarcimento').hidden = !perfilAtual().hibrida;

  if (perfilAtual().sem_termo) {
    document.getElementById('campoProblema').style.display = '';
    try {
      const r = await fetch('/painel/api/operacoes/problemas', { headers: auth() });
      const d = await lerResposta(r);
      document.getElementById('problemaId').innerHTML =
        '<option value="">(o do perfil)</option>' + (d.problemas || [])
          .map((p) => `<option value="${p.id}">${escapeHtml(p.descricao || '')}</option>`).join('');
    } catch (e) { /* o perfil decide sozinho */ }
  }
  buscarServico();
}

/* ── buscar serviço ─────────────────────────────────────────────────────────
   🚨 CLONADO DO GERAR OS (pedido seu, 21/08). O que existia aqui era um
   `<input>` que repovoava um `<select>` a cada tecla: ninguém SELECIONAVA nada
   -- o valor era o que calhasse de ficar em primeiro, o id nunca aparecia, e a
   lista mudava sob o dedo de quem estava digitando. */
let servicoSelecionado = null;

function abrirModalServico() {
  abrirModal('modalServico');
  buscarServico(document.getElementById('buscaServico').value || '');
}

let buscaTimer = null;
document.getElementById('buscaServico').addEventListener('input', (e) => {
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(() => buscarServico(e.target.value), 400);
});

function selecionarServico(s) {
  servicoSelecionado = s;
  document.getElementById('servicoCampo').value =
    `${s.descricao || ''} (#${s.id})`;
  fecharModal('modalServico');
}

function buscarServico(q) {
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(async () => {
    const div = document.getElementById('servicosResultado');
    div.innerHTML = 'Buscando… <span class="spinner"></span>';
    try {
      const r = await fetch('/painel/api/operacoes/servicos/buscar?q=' + encodeURIComponent(q || ''),
                            { headers: auth() });
      const d = await lerResposta(r);
      const achados = d.resultados || [];
      if (!achados.length) {
        div.innerHTML = '<div class="aviso">Nenhum serviço encontrado.</div>';
        return;
      }
      div.innerHTML = '';
      achados.forEach((s) => {
        const el = document.createElement('div');
        el.className = 'modal-item';
        el.innerHTML = `<span>${escapeHtml(s.descricao || '')}</span>` +
          `<span class="dim">#${escapeHtml(String(s.id))}</span>`;
        el.onclick = () => selecionarServico(s);
        div.appendChild(el);
      });
    } catch (e) {
      div.innerHTML = `<div class="msg msg-erro">${escapeHtml(e.message)}</div>`;
    }
  }, 400);
}

/* O corpo e montado UMA vez e serve a previa e a gravacao -- se cada uma
   montasse o seu, elas poderiam divergir sem ninguem ver. */
/* Aceita `1.234,56` e `1234.56`: o operador digita como fala. Vazio devolve
   null, e aí vale o padrão do perfil. */
function valorRessarcimento() {
  const cru = (document.getElementById('valorRessarcimento') || {}).value || '';
  const limpo = cru.trim().replace(/\./g, '').replace(',', '.');
  const n = parseFloat(limpo);
  return Number.isFinite(n) ? n : null;
}

function corpoOS(confirmar) {
  lerCampos();
  const linhas = linhasPlacas.filter((l) => !l.recipiente && !l.entrada);
  const problema = document.getElementById('problemaId');
  return {
    perfil: document.getElementById('perfil').value,
    cliente_id: (cliente && cliente.harmonit) ? cliente.harmonit.id : 0,
    lote: lote,
    termo: (extraido && extraido.termo) || '',
    observacao: document.getElementById('observacao').value,
    /* 🚨 OS DOIS CAMPOS QUE O SERVIDOR SEMPRE ESPEROU. `valor_ressarcimento` e
       `motivo_financeira_zero` existem no `MontarInput` desde sempre e a tela
       nunca os mandava -- entao o ressarcimento saía R$ 0,00 e o servidor
       pedia um motivo que não havia onde preencher. */
    valor_ressarcimento: valorRessarcimento(),
    motivo_financeira_zero: (document.getElementById('motivoZero') || {}).value || '',
    problema_id: problema && problema.value ? +problema.value : null,
    produto_servico_id: (servicoSelecionado && servicoSelecionado.id) || 0,
    prioridade_id: +document.getElementById('prioridadeId').value || 382,
    placas: linhas.map((l) => {
      /* 🚨 PAREIA POR `origem`, NAO PELO TEXTO DO VEICULO. Ate 21/08 era
         `x.veiculo === l.veiculo`, e na substituicao os dois veiculos sao
         DIFERENTES por definicao -- "FIAT FIORINO 2020/2021" sai, "FIAT/FIORINO
         ENDURANCE" entra. O `find` nunca achava, a tela mandava
         `placa_entrada: null` e o servidor barrava com "a Substituicao exige a
         placa de entrada" -- uma placa que estava VISIVEL na tela. */
      const par = linhasPlacas.find((x) => x.entrada && x.origem === l.id);
      return {
        placa: l.placa, veiculo: l.veiculo,
        placa_entrada: par ? par.placa : null,
        veiculo_entrada: par ? par.veiculo : '',
        modelo_escolhido: l.modelo_escolhido || null,
      };
    }),
    itens: ((extraido && extraido.itens_contrato) || []).map((i) => ({
      descricao: i.descricao, quantidade: i.quantidade,
      valor_unitario: i.valor_unitario,
      comodato_ou_aquisicao: i.comodato_ou_aquisicao,
    })),
    confirmar: !!confirmar,
  };
}

async function conferirOS() {
  msg('msgEtapa4', 'Montando a prévia… <span class="spinner"></span>', '');
  document.getElementById('btnGerar').disabled = true;
  try {
    const res = await fetch('/painel/api/operacoes/os/previa', {
      method: 'POST', headers: { ...auth(), 'Content-Type': 'application/json' },
      body: JSON.stringify(corpoOS(false)),
    });
    previa = await lerResposta(res);
    desenharPrevia(previa);
    msg('msgEtapa4', '', '');
  } catch (e) {
    previa = null;
    document.getElementById('previaOS').innerHTML = '';
    msg('msgEtapa4', escapeHtml(e.message), 'msg-erro');
  }
}

/* 🚨 OS DOIS ESTADOS QUE PRODUZIAM O MESMO TEXTO. "Nasceu agora" e normal
   nesta aba -- a etapa 3 acabou de criar a placa. "Nao consegui ler a WESO" e
   o defeito da OS 16775. O servidor sabe em qual esta porque ele mesmo criou a
   placa; a tela so precisa NAO misturar os dois. */
function desenharModelos(placas) {
  const precisam = placas.filter((p) => !p.modelo_na_weso);
  document.getElementById('blocoModelos').style.display = precisam.length ? '' : 'none';
  if (!precisam.length) return;

  const opcoes = '<option value="">(deixar em branco)</option>' + modelosDePara
    .map((m) => `<option value="${escapeHtml(m.modelo)}">${escapeHtml(m.modelo)}` +
                `${m.tem_produto ? '' : ' — sem produto no de-para'}</option>`).join('');

  document.querySelector('#tabelaModelos thead').innerHTML =
    '<tr><th>Placa</th><th>Situação</th><th class="col-modelo">Modelo</th></tr>';
  document.querySelector('#tabelaModelos tbody').innerHTML = precisam.map((p) => {
    const cor = p.motivo === 'weso_nao_respondeu' ? 'badge-red' : 'badge-blue';
    return `<tr>
      <td><strong>${escapeHtml(p.placa)}</strong></td>
      <td><span class="badge ${cor}">${escapeHtml(p.motivo || '')}</span>
          <div class="ajuda">
            ${escapeHtml(p.recado || '')}</div></td>
      <td><select data-placa="${escapeHtml(p.placa)}" onchange="escolherModelo(this)">
            ${opcoes}</select></td></tr>`;
  }).join('');

  precisam.forEach((p) => {
    if (!p.modelo_escolhido) return;
    const el = document.querySelector(`#tabelaModelos select[data-placa="${p.placa}"]`);
    if (el) el.value = p.modelo_escolhido;
  });
}

function escolherModelo(el) {
  const l = linhasPlacas.find((x) => x.placa === el.dataset.placa);
  if (l) l.modelo_escolhido = el.value || null;
  /* Reconfere sozinho: escolher o modelo muda o material e a descricao, e
     mostrar a previa velha ao lado da escolha nova seria mentir. */
  conferirOS();
}

function desenharPrevia(d) {
  desenharModelos(d.placas || []);

  let html = '';
  if ((d.pendentes || []).length) {
    html += `<div class="msg msg-erro" style="display:block"><strong>` +
      `${d.pendentes.length} item(ns) do termo sem vínculo no catálogo</strong> — ` +
      `a OS sairia sem eles, e ninguém veria. Vincule antes de gerar:<ul>` +
      d.pendentes.map((p) => `<li>${escapeHtml(p)}</li>`).join('') + `</ul></div>`;
  }
  if ((d.avisos || []).length) {
    html += `<div class="aviso-info"><strong>${d.avisos.length} aviso(s)</strong><ul>` +
      d.avisos.map((a) => `<li>${escapeHtml(a)}</li>`).join('') + `</ul></div>`;
  }

  html += (d.operacoes || []).map((op) => {
    const fin = op.eh_financeira;
    return `<div class="panel cartao-previa">
      <div class="linha-entre">
        <strong>${escapeHtml(op.rotulo || '')}</strong>
        <span class="badge ${fin ? 'badge-blue' : 'badge-green'}">
          ${fin ? 'financeira' : 'operacional'}</span></div>
      <div class="sub-previa">
        ${escapeHtml(op.descricao || '')}</div>
      <table><thead><tr><th>Material</th><th class="col-qtd">Qtd</th>
        <th class="col-valor">Valor</th><th class="col-flags">Flags</th></tr></thead>
        <tbody>${(op.materiais || []).map((m) => `<tr>
          <td>${escapeHtml(m.descricao || '')}</td>
          <td>${m.quantidade}</td>
          <td>${Number(m.valor_unitario || 0).toLocaleString('pt-BR',
                {style:'currency',currency:'BRL'})}</td>
          <td>${m.comodato ? '<span class="badge badge-blue">comodato</span>' : ''}
              ${m.cobrar ? '<span class="badge badge-green">cobrar</span>' : ''}</td>
        </tr>`).join('')}</tbody></table></div>`;
  }).join('');

  document.getElementById('previaOS').innerHTML = html;
  /* Só o BLOQUEIO fala. Quantas OS vao sair esta no botao, que e onde a mao
     esta indo. */
  document.getElementById('osInfo').innerHTML = d.pode_gerar ? ''
    : '<strong>Bloqueado</strong> — resolva os vínculos pendentes.';
  const btn = document.getElementById('btnGerar');
  btn.disabled = !d.pode_gerar;
  const quantas = (d.operacoes || []).length;
  btn.textContent = quantas ? `Gerar ${quantas} OS` : 'Gerar as OS';
}

async function gerarOS() {
  if (!previa || !previa.pode_gerar) return;

  /* 🚨 A TRAVA QUE A TELA VELHA TEM E A ABA TINHA PERDIDO. `gerar_os.html:810`
     pergunta antes de gravar desde sempre; a aba nova nao perguntava nada.
     O numero vai no texto porque e a ultima chance de perceber que sao 3 e
     deveriam ser 2. */
  const quantas = (previa.operacoes || []).length;
  if (!confirm(
      `Gerar ${quantas} OS no Harmonit?\n\n` +
      `Essa acao e real e nao tem como desfazer em lote.`)) {
    return;
  }

  const btn = document.getElementById('btnGerar');
  btn.disabled = true;
  const prog = document.getElementById('progressoOS');
  prog.innerHTML = 'Gravando no Harmonit… <span class="spinner"></span>';
  msg('msgEtapa4', '', '');
  try {
    const res = await fetch('/painel/api/operacoes/os/gerar', {
      method: 'POST', headers: { ...auth(), 'Content-Type': 'application/json' },
      body: JSON.stringify(corpoOS(true)),
    });
    const d = await lerResposta(res);
    /* As OS sairam: a rodada acabou e a chave nao serve mais. Deixa-la ali
       ofereceria retomar algo que ja terminou. */
    esquecerLote();
    prog.textContent = '';
    document.getElementById('previaOS').innerHTML =
      `<table><thead><tr><th>OS</th><th>Placa</th><th>Tipo</th>
        <th>Materiais</th></tr></thead><tbody>` +
      (d.criadas || []).map((r) => `<tr>
        <td>${r.ok ? `<strong>${escapeHtml(String(r.numero_ordem || ''))}</strong>`
                   : '<span class="badge badge-red">falhou</span>'}</td>
        <td>${escapeHtml(r.placa || '')}</td>
        <td>${escapeHtml(r.rotulo || '')}</td>
        <td class="mini">${escapeHtml(
          r.ok ? (r.materiais_erro || []).join('; ') || 'todos aceitos'
               : (r.erro || ''))}</td></tr>`).join('') + '</tbody></table>';
    msg('msgEtapa4', d.com_erro
        ? `<strong>${d.com_erro} de ${d.total} OS com problema.</strong> Os números acima são o que existe no Harmonit.`
        : `<strong>${d.total} OS criadas.</strong>` +
          ((d.pendencias || []).length
            ? ` ${d.pendencias.length} ficaram esperando a rotina (recipiente ou oficina).`
            : ''),
        d.com_erro ? 'msg-erro' : 'msg-ok');
  } catch (e) {
    prog.textContent = '';
    btn.disabled = false;
    msg('msgEtapa4', escapeHtml(e.message), 'msg-erro');
  }
}

irPara(1);
carregarPerfis().then(oferecerRetomada);
</script>
