<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Histórico de OS — FPSL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root {
    --blue:#2563EB; --blue-dim:#EFF6FF; --green:#16a34a; --green-dim:#F0FDF4;
    --red:#DC2626; --red-dim:#FEF2F2; --amber:#D97706; --amber-dim:#FFFBEB;
    --bg:#F8FAFC; --bg2:#F1F5F9; --text:#0F172A; --text2:#64748B;
    --border:#E2E8F0; --card:#FFFFFF; --sidebar-bg:#0F172A; --sidebar-tx:#94A3B8; --sidebar-w:230px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg2); font-family:'Inter',system-ui,sans-serif; color:var(--text); }
  .layout { display:flex; min-height:100vh; }
  .sidebar { width:var(--sidebar-w); background:var(--sidebar-bg); flex-shrink:0; display:flex; flex-direction:column;
             padding:20px 0; position:sticky; top:0; height:100vh; }
  .sidebar-logo { padding:0 20px 20px; font-weight:800; color:#fff; font-size:1rem; }
  .sidebar-nav { display:flex; flex-direction:column; gap:2px; padding:0 12px; flex:1; }
  .sidebar-nav a { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:7px;
                   color:var(--sidebar-tx); text-decoration:none; font-size:.86rem; font-weight:500; }
  .sidebar-nav a:hover { background:rgba(255,255,255,.06); color:#fff; }
  .sidebar-nav a.active { background:var(--blue); color:#fff; }
  .sidebar-bottom { padding:12px; }
  .sidebar-bottom button { width:100%; padding:9px; border-radius:7px; border:1px solid rgba(255,255,255,.15);
                            background:transparent; color:var(--sidebar-tx); font-size:.82rem; font-family:inherit; cursor:pointer; }
  .main { flex:1; padding:32px; max-width:1080px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  h1 { font-size:1.3rem; font-weight:700; }
  .sub { color:var(--text2); font-size:.84rem; margin-bottom:18px; }
  .painel-ctrl { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:16px;
                 background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .fld label { display:block; font-size:.72rem; color:var(--text2); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }
  .fld input { padding:8px 11px; border:1.5px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); font-size:.86rem; font-family:inherit; width:130px; }
  .btn { font-family:inherit; font-size:.86rem; font-weight:600; padding:9px 16px; border-radius:7px; border:1.5px solid transparent; cursor:pointer; }
  .btn-primary { background:var(--blue); color:#fff; } .btn-primary:hover { background:#1d4ed8; }
  .btn-ghost { background:var(--card); color:var(--text); border-color:var(--border); }
  .stat { display:inline-flex; flex-direction:column; gap:2px; padding:0 14px; min-width:120px; }
  .stat b { font-size:1.15rem; } .stat span { font-size:.72rem; color:var(--text2); text-transform:uppercase; letter-spacing:.03em; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th { text-align:left; color:var(--text2); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.03em;
       padding:11px 12px; border-bottom:1.5px solid var(--border); white-space:nowrap; }
  td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  .badge { font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .badge-blue { background:var(--blue-dim); color:var(--blue); }
  .badge-green { background:var(--green-dim); color:var(--green); }
  .badge-amber { background:var(--amber-dim); color:var(--amber); }
  .badge-gray { background:var(--bg2); color:var(--text2); }
  .msg { font-size:.82rem; padding:8px 12px; border-radius:6px; display:none; margin-bottom:12px; }
  .msg-ok { background:var(--green-dim); color:var(--green); display:block; }
  .msg-erro { background:var(--red-dim); color:var(--red); display:block; }
  .empty { text-align:center; color:var(--text2); padding:24px; }
  .ofi { font-size:.76rem; color:var(--text); line-height:1.5; }
  .chk { display:flex; align-items:center; gap:6px; font-size:.82rem; color:var(--text2); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">FPSL</div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-bottom"><button onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button></div>
  </aside>

  <main class="main">
    <div class="top"><h1>Histórico de OS</h1></div>
    <p class="sub">Varredura sequencial das OS do Harmonit (por número crescente), lendo a oficina embutida em cada uma.
       <strong>Fase 1: só leitura</strong> — nada é gravado na WESO ainda.</p>

    <div class="painel-ctrl">
      <div class="stat"><b id="stTotal">—</b><span>OS no histórico</span></div>
      <div class="stat"><b id="stCheckpoint">—</b><span>Última OS (checkpoint)</span></div>
      <div class="fld">
        <label for="desde">Varrer a partir de (opcional)</label>
        <input type="number" id="desde" placeholder="ex.: 16450">
      </div>
      <button class="btn btn-primary" id="btnVarrer" onclick="varrer()"><i class="bi bi-search"></i> Varrer agora</button>
      <button class="btn btn-ghost" id="btnResync" onclick="resync()"><i class="bi bi-arrow-repeat"></i> Resync janela</button>
      <div class="fld">
        <label for="cpEdit">Ajustar checkpoint</label>
        <input type="number" id="cpEdit" placeholder="nº OS">
      </div>
      <button class="btn btn-ghost" onclick="salvarCheckpoint()">Salvar checkpoint</button>
      <label class="chk"><input type="checkbox" id="soOficina" onchange="carregar()"> só com oficina</label>
    </div>

    <div id="msg" class="msg"></div>

    <div class="card">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>OS</th><th>Data prev.</th><th>Cliente</th><th>Problema</th><th>Produto</th><th>Oficinas</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="6" class="empty">Carregando…</td></tr></tbody>
      </table>
      </div>
    </div>
  </main>
</div>

<script src="/painel/static/sidebar.js"></script>
<script>
const token = localStorage.getItem('fpsl_painel_token');
if (!token) window.location.href = '/painel';
montarSidebar('os_historico');
function auth() { return { 'Authorization': 'Bearer ' + token }; }
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showMsg(t, erro) { const m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(erro?'msg-erro':'msg-ok'); }

const PROB_FINANCEIRO = 11701;

function ofiHtml(ofs) {
  if (!ofs || !ofs.length) return '<span style="color:var(--text2)">—</span>';
  return '<div class="ofi">' + ofs.map(o => {
    const st = o.status === 1 ? '<span class="badge badge-green">Instalado</span>'
             : o.status === 2 ? '<span class="badge badge-amber">Desinstalado</span>'
             : '<span class="badge badge-gray">st'+esc(o.status)+'</span>';
    return `${st} <strong>${esc(o.veiculoPlaca)}</strong> · ${esc(o.equipamentoId)}`;
  }).join('<br>') + '</div>';
}

async function carregar() {
  const so = document.getElementById('soOficina').checked;
  const res = await fetch('/painel/api/os-scan/historico?limit=500&apenas_com_oficina=' + so, { headers: auth() });
  if (res.status === 401) { window.location.href='/painel'; return; }
  const data = await res.json();
  document.getElementById('stTotal').textContent = data.total;
  document.getElementById('stCheckpoint').textContent = data.checkpoint;
  document.getElementById('cpEdit').placeholder = data.checkpoint;
  if (data.alerta) showMsg('⚠ ' + data.alerta, true);
  const tb = document.getElementById('tbody');
  if (!data.itens.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">Nada ainda. Use "Varrer agora".</td></tr>'; return; }
  tb.innerHTML = data.itens.map(o => {
    const fin = o.problema === PROB_FINANCEIRO ? ' <span class="badge badge-gray">financeira</span>' : '';
    const exc = o.excluida ? ' <span class="badge badge-red">excluída</span>' : '';
    return `<tr${o.excluida ? ' style="opacity:.55"' : ''}>
      <td><strong>${esc(o.numero_os)}</strong>${fin}${exc}</td>
      <td style="color:var(--text2)">${esc(o.data_previsao)||'—'}</td>
      <td>${esc(o.cliente_id)||'—'}</td>
      <td>${esc(o.problema)||'—'}</td>
      <td>${esc(o.produto_id)||'—'}</td>
      <td>${ofiHtml(o.oficinas)}</td>
    </tr>`;
  }).join('');
}

async function varrer() {
  const btn = document.getElementById('btnVarrer'); btn.disabled = true; btn.textContent = 'Varrendo…';
  try {
    const desde = document.getElementById('desde').value;
    const url = '/painel/api/os-scan/varrer' + (desde ? ('?desde=' + encodeURIComponent(desde)) : '');
    const res = await fetch(url, { method: 'POST', headers: auth() });
    const r = await res.json();
    if (!res.ok) throw new Error(r.detail || 'falha');
    showMsg(`Varredura: ${r.lidas} OS lidas (${r.novas} novas), ${r.com_oficina} com oficina. Última: ${r.ultima_os}. Parou em ${r.parou_em} (${r.buracos_no_fim} buracos seguidos).`, false);
    await carregar();
  } catch (e) { showMsg('Erro: ' + e.message, true); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="bi bi-search"></i> Varrer agora'; }
}

async function resync() {
  const btn = document.getElementById('btnResync'); btn.disabled = true; btn.textContent = 'Resync…';
  try {
    const res = await fetch('/painel/api/os-scan/resync', { method: 'POST', headers: auth() });
    const r = await res.json();
    if (!res.ok) throw new Error(r.detail || 'falha');
    showMsg(`Resync: ${r.reencontradas} reconferidas, ${r.excluidas} excluídas, ${r.erros} erros (janela ${r.janela}).`, false);
    await carregar();
  } catch (e) { showMsg('Erro: ' + e.message, true); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Resync janela'; }
}

async function salvarCheckpoint() {
  const v = parseInt(document.getElementById('cpEdit').value, 10);
  if (!v) { showMsg('Informe um número válido.', true); return; }
  const res = await fetch('/painel/api/os-scan/checkpoint', { method:'PUT', headers:{...auth(),'Content-Type':'application/json'}, body: JSON.stringify({valor:v}) });
  if (res.ok) { showMsg('Checkpoint ajustado para ' + v + '. Clique "Varrer agora" para continuar a partir dele.', false); await carregar(); }
  else showMsg('Falha ao salvar checkpoint.', true);
}

carregar();
setInterval(carregar, 60000);  // acompanha o scan de 5 min do servidor sem recarregar a página
</script>
</body>
</html>
