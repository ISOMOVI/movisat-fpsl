# FPSL WESO — server blocks
#
# 🚨 ESTE ARQUIVO É ESPELHO DO QUE ESTÁ NO AR, em
# /etc/nginx/sites-enabled/fpsl.conf. Ele NÃO é a fonte: o nginx lê o de lá.
#
# ⚠️ E ESPELHO DESATUALIZADO JÁ CUSTOU UMA DECISÃO. Até 21/08 esta cópia tinha
# 32 linhas e um único server block na porta 8005, enquanto o arquivo no ar
# tinha 146 linhas e três blocos. A decisão de 14/08 de subir o
# `proxy_read_timeout` do `location /` ficou SETE DIAS no papel porque quem
# conferiu conferiu a cópia. Ao mexer no nginx: ler o de /etc, aplicar lá,
# e ressincronizar isto na mesma passada.
#
# Sincronizado em 2026-08-21.
server {
    listen 80;
    listen [::]:80;
    server_name fpsl.movisat.com.br www.fpsl.movisat.com.br;

    # 2026-07-29: 15 arquivos .bak dentro de frontend/ estavam PUBLICOS em
    # /painel/static/*.bak* (HTTP 200, codigo-fonte completo do painel e lista
    # de endpoints internos). Os arquivos foram movidos para backups/, mas sem
    # esta regra o proximo .bak esquecido reabre o buraco. Espelha a trava que
    # o MoviServer ja tinha desde a criacao.
    location ~* \.(bak|old|orig|save|swp|tmp|py|db|sqlite3?|env)$ { deny all; access_log off; }
    location ~* \.bak[0-9]*_[0-9-]+[a-z]?$ { deny all; access_log off; }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://fpsl.movisat.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fpsl.movisat.com.br www.fpsl.movisat.com.br;

    # 2026-07-29: 15 arquivos .bak dentro de frontend/ estavam PUBLICOS em
    # /painel/static/*.bak* (HTTP 200, codigo-fonte completo do painel e lista
    # de endpoints internos). Os arquivos foram movidos para backups/, mas sem
    # esta regra o proximo .bak esquecido reabre o buraco. Espelha a trava que
    # o MoviServer ja tinha desde a criacao.
    location ~* \.(bak|old|orig|save|swp|tmp|py|db|sqlite3?|env)$ { deny all; access_log off; }
    location ~* \.bak[0-9]*_[0-9-]+[a-z]?$ { deny all; access_log off; }

    ssl_certificate     /etc/letsencrypt/live/fpsl.movisat.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fpsl.movisat.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    if ($host = www.fpsl.movisat.com.br) {
        return 301 https://fpsl.movisat.com.br$request_uri;
    }

    client_max_body_size 1m;
    include /etc/nginx/snippets/security_headers.conf;
    access_log /var/log/nginx/fpsl_access.log fpsl_seguro;
    error_log  /var/log/nginx/fpsl_error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /weso/onboarding {
        proxy_pass            http://127.0.0.1:8004;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    120s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
    }

    # Rate limit no login do painel de OS -- achado na auditoria de
    # segurança de 2026-07-15 (sem proteção a força bruta, nem Nginx nem
    # aplicação). Mesmo padrão já usado no MoviChat (ia_login).
    location /painel/api/login {
        limit_req zone=fpsl_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass            http://127.0.0.1:8004;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    35s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    35s;
    }

    location / {
        proxy_pass            http://127.0.0.1:8004;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    90s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    90s;
    }
}

# Acesso legado interno, sem TLS — mantido em paralelo (usado em healthchecks/scripts já existentes)
